<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBS AR Menu</title>
  <style>
    body {
      font-family: "Helvetica Neue", Arial, sans-serif;
      background-color: #f8f9fa;
      margin: 0;
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #333;
    }

    h1 {
      font-size: 1.4rem;
      margin: 20px 0 30px;
      color: #2c3e50;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      width: 90%;
      max-width: 450px;
    }

    .ar-item {
      display: flex;
      flex-direction: column;
      background: #ffffff;
      text-decoration: none;
      border-radius: 15px;
      border: 2px solid #4da3ff;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      transition: all 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .ar-item:active {
      transform: scale(0.97);
      background: #f0f7ff;
    }

    .ar-image {
      width: 100%;
      height: 150px;
      object-fit: cover;
      background: #eee;
      border-bottom: 1px solid #eee;
    }

    .ar-info {
      padding: 15px;
      text-align: center;
    }

    .ar-title {
      display: block;
      font-weight: bold;
      font-size: 1.1rem;
      color: #4da3ff;
      margin-bottom: 5px;
    }

    .ar-note {
      display: block;
      font-size: 0.85rem;
      color: #666;
      line-height: 1.4;
    }

    .footer-text {
      margin: 40px 0;
      font-size: 0.8rem;
      color: #999;
    }
  </style>
</head>
<body>

  <h1>ARメニューを選択してください</h1>

  <div class="menu-grid">
    <a href="https://bbs-event-dining.github.io/bbs.github.io/box_ar/" class="ar-item">
      <img src="chirashi.jpg" alt="chirashi" class="ar-image">
      <div class="ar-info">
        <span class="ar-title">Doll packaging</span>
        <span class="ar-note">チラシを置いてスキャンしてください</span>
      </div>
    </a>

    <a href="https://bbs-event-dining.github.io/bbs.github.io/bbs_only/" class="ar-item">
      <img src="spot.jpg" alt="spot" class="ar-image">
      <div class="ar-info">
        <span class="ar-title">フォトスポット用</span>
        <span class="ar-note">フォトスポットに向けてください</span>
      </div>
    </a>

    <a href="https://bbs-event-dining.github.io/bbs.github.io/heart_waku/" class="ar-item">
      <img src="heartframe.jpg" alt="heartframe" class="ar-image">
      <div class="ar-info">
        <span class="ar-title">heart frame</span>
        <span class="ar-note">この映像が流れたLED画面に向けてください</span>
      </div>
    </a>

    <a href="https://bbs-event-dining.github.io/bbs.github.io/arch/" class="ar-item">
      <img src="flower.jpg" alt="flower" class="ar-image">
      <div class="ar-info">
        <span class="ar-title">花のarch</span>
        <span class="ar-note">この映像が流れたLED画面に向けてください</span>
      </div>
    </a>
  </div>

  <div class="footer-text">
    &copy; B.B.S. Event Dining
  </div>

</body>
</html>
