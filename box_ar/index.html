<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Valentine AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam;
          debugUIEnabled: false;
          trackingMethod: best;"
    renderer="logarithmicDepthBuffer: true;"
  >

    <!-- marker -->
    <a-marker
      id="hiroMarker"
      type="pattern"
      preset="hiro"
    >

      <!-- 3D Object -->
      <a-entity
        id="arModel"
        gltf-model="box_toAR.glb"
        position="0 0.2 0"
        rotation="0 0 0"
        scale="0.6 0.6 0.6"
        visible="false"
        material="transparent: true; opacity: 1;"
        
        animation__fadeout="
          property: material.opacity;
          from: 1;
          to: 0;
          dur: 500;
          startEvents: fadeOut;
        "
      ></a-entity>

    </a-marker>

    <!-- camera -->
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const marker = document.querySelector('#hiroMarker');
    const model  = document.querySelector('#arModel');

    let hideTimer = null;

    marker.addEventListener('markerFound', () => {
      // 表示
      model.setAttribute('visible', true);
      model.setAttribute('material', 'opacity', 1);

      // タイマー解除
      if (hideTimer) {
        clearTimeout(hideTimer);
        hideTimer = null;
      }
    });

    marker.addEventListener('markerLost', () => {
      // 2.5秒キープ → フェードアウト
      hideTimer = setTimeout(() => {
        model.emit('fadeOut');

        // フェード完了後に非表示
        setTimeout(() => {
          model.setAttribute('visible', false);
        }, 500);
      }, 2500);
    });
  </script>
</body>
</html>
