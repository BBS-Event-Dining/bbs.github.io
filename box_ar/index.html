<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Valentine AR - Hiro Marker</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
    }

    #ui {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      z-index: 10;
    }

    button {
      padding: 12px 20px;
      font-size: 14px;
      border-radius: 999px;
      border: none;
      background: rgba(0,0,0,0.6);
      color: #fff;
    }
  </style>
</head>

<body>

  <!-- UI -->
  <div id="ui">
    <button id="captureBtn">撮影</button>
  </div>

  <!-- AR Scene -->
  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    stats="false"
    inspector="false"
    renderer="preserveDrawingBuffer: true;"
    arjs="sourceType: webcam; debugUIEnabled: false;"
  >

    <!-- Hiro Marker（床から20cm上） -->
    <a-marker preset="hiro" position="0 0.2 0">

      <!-- box_toAR.glb（markerから少し浮かせる） -->
      <a-gltf-model
        src="./box_toAR.glb"
        position="0 0.08 0"
        rotation="0 0 0"
        scale="0.35 0.35 0.35"
      ></a-gltf-model>

    </a-marker>

    <!-- Camera -->
    <a-entity camera></a-entity>

  </a-scene>

  <!-- Script -->
  <script>
    const captureBtn = document.getElementById("captureBtn");

    captureBtn.addEventListener("click", () => {
      const scene = document.querySelector("a-scene");
      const renderer = scene.renderer;

      renderer.render(scene.object3D, scene.camera);

      const link = document.createElement("a");
      link.download = "valentine-ar.png";
      link.href = renderer.domElement.toDataURL("image/png");
      link.click();
    });
  </script>

</body>
</html>
