<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Valentine AR</title>

<!-- A-Frame -->
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<!-- AR.js -->
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

<style>
  body {
    margin: 0;
    overflow: hidden;
  }

  /* 撮影ボタンのみ表示 */
  #captureBtn {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: none;
    font-size: 28px;
    background: rgba(255,255,255,0.9);
    z-index: 10;
  }

  /* A-Frame / VR / AR UI 完全削除 */
  .a-enter-vr,
  .a-enter-vr-button,
  .a-enter-ar,
  .a-enter-ar-button,
  .a-orientation-modal,
  .a-fullscreen-button {
    display: none !important;
  }
</style>
</head>

<body>

<button id="captureBtn">📸</button>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  renderer="preserveDrawingBuffer: true; logarithmicDepthBuffer: true;"
  screenshot="width: 1080; height: 1920;"
  arjs="sourceType: webcam; debugUIEnabled: false;"
>

  <!-- Hiro Marker -->
  <a-marker id="hiroMarker" preset="hiro">

    <!-- AR Object -->
    <a-entity
      id="arModel"
      gltf-model="box_toAR.glb"
      position="0 0.2 0"
      scale="0.6 0.6 0.6"
      visible="false"
      material="transparent: true; opacity: 1;"
      animation__fadeout="
        property: material.opacity;
        from: 1;
        to: 0;
        dur: 500;
        startEvents: fadeOut;
      "
    ></a-entity>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
  // 念押し：VRボタンDOM削除
  document.addEventListener("DOMContentLoaded", () => {
    const vrBtn = document.querySelector(".a-enter-vr-button");
    if (vrBtn) vrBtn.remove();
  });

  const marker = document.querySelector("#hiroMarker");
  const model  = document.querySelector("#arModel");
  const captureBtn = document.querySelector("#captureBtn");

  let hideTimer = null;
  let capturing = false;

  // marker 検出
  marker.addEventListener("markerFound", () => {
    model.setAttribute("visible", true);
    model.setAttribute("material", "opacity", 1);

    if (hideTimer) {
      clearTimeout(hideTimer);
      hideTimer = null;
    }
  });

  // marker ロスト → 表示保持 → フェードアウト
  marker.addEventListener("markerLost", () => {
    if (capturing) return;

    hideTimer = setTimeout(() => {
      model.emit("fadeOut");

      setTimeout(() => {
        model.setAttribute("visible", false);
      }, 500);
    }, 2500);
  });

  // 撮影（A-Frame Screenshot方式）
  captureBtn.addEventListener("click", () => {
    const sceneEl = document.querySelector("a-scene");
    if (!sceneEl.components.screenshot) return;

    capturing = true;

    // 最終合成をキャプチャ
    sceneEl.components.screenshot.capture("perspective");

    setTimeout(() => {
      const canvas =
        sceneEl.components.screenshot.getCanvas("perspective");

      if (!canvas) return;

      const img = canvas.toDataURL("image/png");

      const a = document.createElement("a");
      a.href = img;
      a.download = "valentine_ar.png";
      a.click();

      capturing = false;
    }, 120);
  });
</script>

</body>
</html>
