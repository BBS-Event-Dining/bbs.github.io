<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>BBS AR - Self Shadow Only</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    .mindar-ui-overlay.mindar-ui-loading { background: rgba(0,0,0,0.8); }
    #shoot { 
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); 
      z-index: 1000; padding: 15px 35px; font-size: 18px; font-weight: bold; 
      border-radius: 50px; border: none; background: #4da3ff; color: #fff; 
      display: none; cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    #preview-container { 
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      background: rgba(0,0,0,0.9); z-index: 99999; flex-direction: column; 
      align-items: center; justify-content: center; 
    }
    #preview-image { width: auto; height: 80%; max-width: 95%; border: 1px solid #fff; object-fit: contain; }
    #close-btn { margin-top: 15px; padding: 12px 40px; background: #fff; border: none; font-weight: bold; border-radius: 5px; }
  </style>
</head>
<body>
  <button id="shoot">撮影する</button>
  <div id="preview-container">
    <img id="preview-image" src="">
    <button id="close-btn">閉じる</button>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: chirashi.mind; autoStart: true; uiLoading: yes; uiScanning: yes; filterMinCF: 0.0001; filterBeta: 1000; missTolerance: 60; warmupTolerance: 10;" 
    renderer="preserveDrawingBuffer: true; alpha: true; antialias: true; colorManagement: true; shadowMapEnabled: true;" 
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <a-asset-item id="box-model" src="box_toAR.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity light="type: ambient; intensity: 0.7"></a-entity>
    
    <a-entity light="type: directional; 
                   intensity: 0.8; 
                   castShadow: true; 
                   shadowMapHeight: 2048; 
                   shadowMapWidth: 2048; 
                   shadowCameraLeft: -3; 
                   shadowCameraRight: 3; 
                   shadowCameraBottom: -3; 
                   shadowCameraTop: 3;
                   shadowBias: -0.001;" 
              position="2 4 2"></a-entity>

    <a-entity mindar-image-target="targetIndex: 0" id="bbs-target">
      <a-gltf-model 
        src="#box-model" 
        position="0 0 0" 
        rotation="0 0 0" 
        scale="1.8 1.8 1.8"
        shadow="cast: true; receive: true">
      </a-gltf-model>
    </a-entity>
  </a-scene>

  <script>
    const sceneEl = document.querySelector('a-scene');
    const shootBtn = document.getElementById('shoot');
    const targetEl = document.getElementById('bbs-target');

    targetEl.addEventListener('targetFound', () => { 
      shootBtn.style.display = 'block'; 
    });
    
    targetEl.addEventListener('targetLost', () => { 
      shootBtn.style.display = 'none'; 
    });

    shootBtn.addEventListener('click', () => {
      const video = document.querySelector('video');
      const sceneCanvas = sceneEl.canvas;
      if (!video || !sceneCanvas) return;
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      sceneEl.renderer.render(sceneEl.object3D, sceneEl.camera);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      ctx.drawImage(sceneCanvas, 0, 0, canvas.width, canvas.height);
      document.getElementById('preview-image').src = canvas.toDataURL('image/jpeg');
      document.getElementById('preview-container').style.display = 'flex';
    });

    document.getElementById('close-btn').onclick = () => {
      document.getElementById('preview-container').style.display = 'none';
    };
  </script>
</body>
</html>
