<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Heart AR Experience</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
  
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #shoot { 
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); 
      z-index: 1000; padding: 15px 45px; font-size: 18px; font-weight: bold; 
      border-radius: 50px; border: none; background: #ff6b81; color: #fff; 
      display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
    }
    #preview-container { 
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      background: rgba(0,0,0,0.9); z-index: 20000; flex-direction: column; 
      align-items: center; justify-content: center; 
    }
    #preview-image { max-width: 85%; max-height: 75%; border: 3px solid white; object-fit: contain; }
    .save-note { color: white; margin-bottom: 10px; font-size: 16px; font-weight: bold; }
    #close-btn { margin-top: 20px; padding: 12px 25px; background: white; border: none; font-weight: bold; cursor: pointer; border-radius: 5px; }
  </style>
</head>
<body>
  <button id="shoot">撮影</button>

  <div id="preview-container">
    <div class="save-note">長押しで保存</div>
    <img id="preview-image" src="">
    <button id="close-btn">閉じる</button>
  </div>

  <a-scene embedded 
    mindar-image="imageTargetSrc: ./heart_open.mind; filterMinCF:0.0001; filterBeta: 0.001;" 
    renderer="preserveDrawingBuffer: true; alpha: true; colorManagement: true; antialias: true;" 
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <a-asset-item id="heart-model" src="./heart_waku.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0" id="heart-target">
      <a-gltf-model 
        src="#heart-model" 
        rotation="90 0 0" 
        position="0 0 0" 
        scale="1 1 1"
        animation-mixer>
      </a-gltf-model>
    </a-entity>
  </a-scene>

  <script>
    const sceneEl = document.querySelector('a-scene');
    const shootBtn = document.getElementById('shoot');

    // シーン準備完了で撮影ボタン表示
    sceneEl.addEventListener('renderstart', () => {
      shootBtn.style.display = 'block';
    });

    // 撮影処理
    shootBtn.addEventListener('click', () => {
      sceneEl.renderer.render(sceneEl.object3D, sceneEl.camera);
      const video = document.querySelector('video');
      const canvas = document.createElement('canvas');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const ctx = canvas.getContext('2d');
      
      const videoAspect = video.videoWidth / video.videoHeight;
      const canvasAspect = canvas.width / canvas.height;
      let sx, sy, sw, sh;

      if (videoAspect > canvasAspect) {
        sw = video.videoHeight * canvasAspect; sh = video.videoHeight;
        sx = (video.videoWidth - sw) / 2; sy = 0;
      } else {
        sw = video.videoWidth; sh = video.videoWidth / canvasAspect;
        sx = 0; sy = (video.videoHeight - sh) / 2;
      }
      
      ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
      ctx.drawImage(sceneEl.canvas, 0, 0, canvas.width, canvas.height);
      
      document.getElementById('preview-image').src = canvas.toDataURL('image/png');
      document.getElementById('preview-container').style.display = 'flex';
    });

    // プレビューを閉じる
    document.getElementById('close-btn').onclick = () => {
      document.getElementById('preview-container').style.display = 'none';
    };
  </script>
</body>
</html>
