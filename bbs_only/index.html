<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>BBS Heart AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #shoot { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 1000; padding: 15px 35px; font-size: 18px; font-weight: bold; border-radius: 50px; border: none; background: #ff4d6d; color: #fff; display: none; cursor: pointer; }
    #preview-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 20000; flex-direction: column; align-items: center; justify-content: center; }
    #preview-image { max-width: 90%; max-height: 80%; border: 2px solid #fff; object-fit: contain; }
    #close-btn { margin-top: 20px; padding: 12px 25px; background: #fff; border: none; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <button id="shoot">撮影する</button>
  <div id="preview-container">
    <img id="preview-image" src="">
    <button id="close-btn">閉じる</button>
  </div>

  <a-scene 
    embedded 
    mindar-image="imageTargetSrc: ./bbs.mind; autoStart: true; uiLoading: no; uiScanning: no;" 
    renderer="preserveDrawingBuffer: true; alpha: true; antialias: true;" 
    vr-mode-ui="enabled: false">
    
    <a-assets><img id="heart-img" src="heart.png"></a-assets>
    
    <a-camera position="0 0 0" look-controls="enabled: false">
        <a-entity id="bbs-container" position="0 -0.5 -2"></a-entity>
    </a-camera>

    <a-entity mindar-image-target="targetIndex: 0" id="bbs-target"></a-entity>
  </a-scene>

  <script>
    const sceneEl = document.querySelector('a-scene');
    const shootBtn = document.getElementById('shoot');
    const targetEl = document.getElementById('bbs-target');
    const container = document.getElementById('bbs-container');
    let isFound = false;

    targetEl.addEventListener('targetFound', () => { isFound = true; shootBtn.style.display = 'block'; });
    targetEl.addEventListener('targetLost', () => { isFound = false; shootBtn.style.display = 'none'; });

    function spawnBBSHeart() {
      if (!isFound) return;
      const heart = document.createElement('a-entity');
      const startX = (Math.random() - 0.5) * 3.0; 
      const startZ = (Math.random() - 0.5) * 2.0;

      heart.setAttribute('geometry', { primitive: 'plane', width: 0.15, height: 0.15 });
      heart.setAttribute('material', { src: '#heart-img', transparent: true, shader: 'flat' });
      heart.setAttribute('position', `${startX} -1.0 ${startZ}`);
      
      heart.setAttribute('animation__move', {
        property: 'position', to: `${startX} 2.0 ${startZ}`, dur: 5000, easing: 'linear'
      });
      heart.setAttribute('animation__fade', {
        property: 'material.opacity', from: 1, to: 0, dur: 5000
      });

      container.appendChild(heart);
      setTimeout(() => { if(heart.parentNode) heart.parentNode.removeChild(heart); }, 5000);
    }
    setInterval(spawnBBSHeart, 400);

    shootBtn.addEventListener('click', () => {
      const video = document.querySelector('video');
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');

      if (!video) return;

      // ビデオの実際の解像度をセット
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      // 1. カメラ映像を描画
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      // 2. ARを描画する直前にレンダリング状態を同期
      // これを足すことで、OS問わず「今のハート」がCanvasに反映されるわ
      sceneEl.renderer.render(sceneEl.object3D, sceneEl.camera);
      
      // 3. ARコンテンツ（ハート）を重ねる
      ctx.drawImage(sceneEl.canvas, 0, 0, canvas.width, canvas.height);

      // 4. 表示
      document.getElementById('preview-image').src = canvas.toDataURL('image/png');
      document.getElementById('preview-container').style.display = 'flex';
    });

    document.getElementById('close-btn').onclick = () => {
      document.getElementById('preview-container').style.display = 'none';
    };
  </script>
</body>
</html>
