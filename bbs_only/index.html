<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>BBS Heart AR High-Res</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent !important; }
    video { position: absolute !important; z-index: -1 !important; }
    .a-canvas { position: absolute !important; z-index: 1 !important; background: transparent !important; }
    #shoot { 
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); 
      z-index: 1000; padding: 15px 35px; font-size: 18px; font-weight: bold; 
      border-radius: 50px; border: none; background: #ff4d6d; color: #fff; 
      display: none; cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    #preview-container { 
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      background: rgba(0,0,0,0.95); z-index: 99999; flex-direction: column; 
      align-items: center; justify-content: center; 
    }
    #preview-image { width: auto; height: 80%; max-width: 95%; border: 1px solid #fff; object-fit: contain; }
    #close-btn { margin-top: 15px; padding: 12px 40px; background: #fff; border: none; font-weight: bold; border-radius: 5px; }
  </style>
</head>
<body>
  <button id="shoot">撮影する</button>
  <div id="preview-container">
    <img id="preview-image" src="">
    <button id="close-btn">閉じる</button>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./bbs.mind; autoStart: true; uiLoading: no; uiScanning: no; filterMinCF:0.0001; filterBeta: 0.1; missTolerance: 5;" 
    renderer="preserveDrawingBuffer: true; alpha: true; antialias: true; colorManagement: true; precision: high;" 
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <img id="heart-img" src="heart.png">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0" id="bbs-target">
      <a-entity id="bbs-container"></a-entity>
    </a-entity>
  </a-scene>

  <script>
    const sceneEl = document.querySelector('a-scene');
    const shootBtn = document.getElementById('shoot');
    const targetEl = document.getElementById('bbs-target');
    const container = document.getElementById('bbs-container');
    let isFound = false;

    targetEl.addEventListener('targetFound', () => { isFound = true; shootBtn.style.display = 'block'; });
    targetEl.addEventListener('targetLost', () => { isFound = false; shootBtn.style.display = 'none'; });

    function spawnBBSHeart() {
      if (!isFound) return;
      const heart = document.createElement('a-entity');
      const startX = (Math.random() - 0.5) * 1.2; 
      const startZ = (Math.random() - 0.5) * 0.3;
      heart.setAttribute('geometry', { primitive: 'plane', width: 0.1, height: 0.1 });
      heart.setAttribute('material', { 
        src: '#heart-img', 
        transparent: true, 
        alphaTest: 0.5, 
        shader: 'flat', 
        side: 'double' 
      });
      heart.setAttribute('position', `${startX} 0 ${startZ}`);
      heart.setAttribute('animation__move', { property: 'position', to: `${startX} 1.5 ${startZ}`, dur: 8000, easing: 'linear' });
      heart.setAttribute('animation__fade', { property: 'material.opacity', from: 1, to: 0, dur: 8000 });
      container.appendChild(heart);
      setTimeout(() => { if(heart.parentNode) heart.parentNode.removeChild(heart); }, 8000);
    }
    setInterval(spawnBBSHeart, 300);

    shootBtn.addEventListener('click', () => {
      const video = document.querySelector('video');
      const sceneCanvas = sceneEl.canvas;
      if (!video || !sceneCanvas) return;

      // 【改善】高画質化のため、動画のネイティブ解像度を基準にCanvasを作成
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      
      // デバイスのピクセル比率を考慮（Retina等でのボケ防止）
      const dpr = window.devicePixelRatio || 1;
      const screenAspect = window.innerWidth / window.innerHeight;

      // 書き出しサイズを動画の最大解像度に合わせる
      canvas.width = video.videoWidth;
      canvas.height = video.videoWidth / screenAspect;

      // 撮影直前にAR描画を更新
      sceneEl.renderer.render(sceneEl.object3D, sceneEl.camera);

      // 実写映像をクロップして描画（中央寄せ）
      const sx = 0;
      const sy = (video.videoHeight - canvas.height) / 2;
      ctx.drawImage(video, sx, sy, video.videoWidth, canvas.height, 0, 0, canvas.width, canvas.height);
      
      // AR映像を重ねる（sceneCanvasのサイズに合わせずCanvas全域にフィットさせる）
      ctx.drawImage(sceneCanvas, 0, 0, canvas.width, canvas.height);

      // 最高画質(1.0)でJPEG出力
      document.getElementById('preview-image').src = canvas.toDataURL('image/jpeg', 1.0);
      document.getElementById('preview-container').style.display = 'flex';
    });

    document.getElementById('close-btn').onclick = () => {
      document.getElementById('preview-container').style.display = 'none';
    };
  </script>
</body>
</html>
