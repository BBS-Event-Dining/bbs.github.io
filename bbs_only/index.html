<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>BBS Multi AR - Heart Fountain</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
  <a-scene mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.001;" 
           renderer="colorManagement: true, preserveDrawingBuffer: true" vr-mode-ui="enabled: false">
    
    <a-assets>
      <img id="heart-img" src="./heart.png">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0" id="target0"></a-entity>
    <a-entity mindar-image-target="targetIndex: 1" id="target1"></a-entity>
    <a-entity mindar-image-target="targetIndex: 2" id="target2"></a-entity>
    <a-entity mindar-image-target="targetIndex: 3" id="target3"></a-entity>
    <a-entity mindar-image-target="targetIndex: 4" id="target4"></a-entity>

  </a-scene>

  <script>
    // 噴水演出のロジック
    function createHeart(targetEl) {
      if (!targetEl.object3D.visible) return;

      const heart = document.createElement('a-entity');
      const size = 0.03 + Math.random() * 0.05; // 大きさランダム
      const startX = (Math.random() - 0.5) * 0.1;
      const startZ = (Math.random() - 0.5) * 0.1;

      heart.setAttribute('geometry', {primitive: 'plane', width: size, height: size});
      heart.setAttribute('material', {src: '#heart-img', transparent: true, shader: 'flat', side: 'double'});
      heart.setAttribute('position', `${startX} 0 ${startZ}`);

      targetEl.appendChild(heart);

      // 噴水アニメーション：10cm上に噴き出して放物線で落ちる
      const peakY = 0.1; // 10cm
      const dropY = -0.5;
      const duration = 1500 + Math.random() * 1000;

      // 上昇から下降へのアニメーション
      heart.setAttribute('animation__up', {
        property: 'position',
        to: `${startX + (Math.random() - 0.5) * 0.2} ${peakY} ${startZ}`,
        dur: duration * 0.4,
        easing: 'easeOutQuad'
      });

      heart.setAttribute('animation__down', {
        property: 'position',
        to: `${startX + (Math.random() - 0.5) * 0.4} ${dropY} ${startZ}`,
        delay: duration * 0.4,
        dur: duration * 0.6,
        easing: 'easeInQuad'
      });

      heart.addEventListener('animationcomplete__down', () => heart.remove());
    }

    // 全ターゲットに対して噴水をループ
    setInterval(() => {
      for(let i=0; i<5; i++) {
        createHeart(document.getElementById(`target${i}`));
      }
    }, 200);
  </script>
</body>
</html>
