<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>BBS Heart AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #shoot { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 1000; padding: 15px 35px; font-size: 18px; font-weight: bold; border-radius: 50px; border: none; background: #ff4d6d; color: #fff; display: none; cursor: pointer; }
    
    /* 撮影後のプレビュー画面（縦長に固定） */
    #preview-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 99999; flex-direction: column; align-items: center; justify-content: center; }
    #preview-image { width: auto; height: 80%; max-width: 95%; border: 2px solid #fff; object-fit: contain; }
    #close-btn { margin-top: 15px; padding: 10px 30px; background: #fff; border: none; font-weight: bold; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <button id="shoot">撮影する</button>
  <div id="preview-container">
    <img id="preview-image" src="">
    <button id="close-btn">閉じる</button>
  </div>

  <a-scene 
    embedded 
    mindar-image="imageTargetSrc: ./bbs.mind; autoStart: true; uiLoading: no; uiScanning: no; filterMinCF: 0.0001; filterBeta: 0.001;" 
    renderer="preserveDrawingBuffer: true; alpha: true; antialias: true;" 
    vr-mode-ui="enabled: false">
    
    <a-assets><img id="heart-img" src="heart.png"></a-assets>
    
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0" id="bbs-target">
      <a-entity id="bbs-container"></a-entity>
    </a-entity>
  </a-scene>

  <script>
    const sceneEl = document.querySelector('a-scene');
    const shootBtn = document.getElementById('shoot');
    const targetEl = document.getElementById('bbs-target');
    const container = document.getElementById('bbs-container');
    let isFound = false;

    targetEl.addEventListener('targetFound', () => { isFound = true; shootBtn.style.display = 'block'; });
    targetEl.addEventListener('targetLost', () => { isFound = false; shootBtn.style.display = 'none'; });

    function spawnBBSHeart() {
      if (!isFound) return;
      const heart = document.createElement('a-entity');
      const startX = (Math.random() - 0.5) * 1.5; 
      const startZ = (Math.random() - 0.5) * 0.5;

      heart.setAttribute('geometry', { primitive: 'plane', width: 0.2, height: 0.2 });
      heart.setAttribute('material', { src: '#heart-img', transparent: true, shader: 'flat', side: 'double' });
      heart.setAttribute('position', `${startX} 0 ${startZ}`);
      
      // スピードをゆっくり上昇（10秒）
      heart.setAttribute('animation__move', {
        property: 'position', to: `${startX} 2.0 ${startZ}`, dur: 10000, easing: 'linear'
      });
      heart.setAttribute('animation__fade', {
        property: 'material.opacity', from: 1, to: 0, dur: 10000
      });

      container.appendChild(heart);
      setTimeout(() => { if(heart.parentNode) heart.parentNode.removeChild(heart); }, 10000);
    }
    setInterval(spawnBBSHeart, 700);

    shootBtn.addEventListener('click', () => {
      // 確実にビデオ要素を取得（Mind-ARが作ったもの）
      const video = document.querySelector('video');
      const sceneCanvas = sceneEl.canvas;
      if (!video || !sceneCanvas) return;

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');

      // キャンバスサイズをビデオの解像度（縦向き基準）に合わせる
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      // 1. 背景のカメラ映像を描画
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      // 2. AR側のレンダリングを最新状態に更新
      sceneEl.renderer.render(sceneEl.object3D, sceneEl.camera);
      
      // 3. ARのCanvas（ハートなど）を上に重ねる
      ctx.drawImage(sceneCanvas, 0, 0, canvas.width, canvas.height);

      // 4. 結果を表示
      const previewImg = document.getElementById('preview-image');
      previewImg.src = canvas.toDataURL('image/png');
      document.getElementById('preview-container').style.display = 'flex';
    });

    document.getElementById('close-btn').onclick = () => {
      document.getElementById('preview-container').style.display = 'none';
    };
  </script>
</body>
</html>
