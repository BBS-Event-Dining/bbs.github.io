<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>BBS Heart AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #shoot {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 1000;
      padding: 15px 35px; font-size: 18px; font-weight: bold; border-radius: 50px;
      border: none; background: #ff4d6d; color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    video { position: absolute; top: 0; left: 0; z-index: -2; }
    #preview-container {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); z-index: 20000; flex-direction: column; align-items: center; justify-content: center;
    }
    #preview-image { max-width: 90%; max-height: 80%; border: 3px solid white; display: block; }
    #preview-text { color: white; margin-top: 15px; font-weight: bold; text-align: center; }
    #close-btn { margin-top: 20px; padding: 12px 25px; background: white; border-radius: 5px; border: none; font-weight: bold; }
  </style>
</head>

<body>

  <button id="shoot" disabled>読み込み中...</button>

  <div id="preview-container">
    <img id="preview-image" src="">
    <div id="preview-text">画像を長押しして保存してください</div>
    <button id="close-btn">閉じる</button>
  </div>

  <a-scene
    embedded
    mindar-image="imageTargetSrc: ./bbs.mind; uiScanning: yes;"
    renderer="preserveDrawingBuffer: true; alpha: true; colorManagement: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img id="heart-img" src="heart.png">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0" id="target0"><a-entity class="fountain"></a-entity></a-entity>
    <a-entity mindar-image-target="targetIndex: 1" id="target1"><a-entity class="fountain"></a-entity></a-entity>
    <a-entity mindar-image-target="targetIndex: 2" id="target2"><a-entity class="fountain"></a-entity></a-entity>

  </a-scene>

  <script>
    const sceneEl = document.querySelector('a-scene');
    const shootBtn = document.getElementById('shoot');
    const previewContainer = document.getElementById('preview-container');
    const previewImage = document.getElementById('preview-image');
    const closeBtn = document.getElementById('close-btn');

    let arReady = false;
    let currentObjectUrl = null;

    function spawnHeart(targetId) {
      const targetEntity = document.getElementById(targetId);
      if (!targetEntity || !targetEntity.getAttribute('visible')) return;

      const container = targetEntity.querySelector('.fountain');
      const heart = document.createElement('a-entity');
      
      const size = 0.04 + Math.random() * 0.06;
      
      // 30cm四方(0.3)の範囲からランダムに発生
      const startX = (Math.random() - 0.5) * 0.3; 
      const startZ = (Math.random() - 0.5) * 0.3; 

      heart.setAttribute('geometry', { primitive: 'plane', width: size, height: size });
      heart.setAttribute('material', { src: '#heart-img', transparent: true, shader: 'flat', side: 'double', opacity: 1 });
      
      heart.setAttribute('position', `${startX} 0 ${startZ}`);
      
      const duration = 3000;
      const moveY = 1.5 + Math.random() * 1.0; // 1.5m〜2.5m上空まで昇る

      // 上昇アニメーション（落下なし）
      heart.setAttribute('animation__up', {
        property: 'position', 
        to: `${startX + (Math.random()-0.5)*0.5} ${moveY} ${startZ + (Math.random()-0.5)*0.5}`, 
        dur: duration, 
        easing: 'easeOutCubic'
      });

      // 徐々に透明にする
      heart.setAttribute('animation__fade', {
        property: 'material.opacity',
        from: 1,
        to: 0,
        dur: duration,
        easing: 'easeInQuad'
      });

      container.appendChild(heart);
      setTimeout(() => { if(heart.parentNode) heart.remove(); }, duration);
    }
