<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>BBS Heart AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>

  <style>
    /* 全画面表示の設定 */
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    
    /* 撮影ボタン：成功コードのデザインを踏襲 */
    #shoot {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 1000;
      padding: 15px 35px; font-size: 18px; font-weight: bold; border-radius: 50px;
      border: none; background: #ff4d6d; color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    
    /* カメラ映像の配置 */
    video { position: absolute; top: 0; left: 0; z-index: -2; }
    
    /* プレビュー画面 */
    #preview-container {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); z-index: 20000; flex-direction: column; align-items: center; justify-content: center;
    }
    #preview-image { max-width: 90%; max-height: 80%; border: 3px solid white; display: block; }
    #preview-text { color: white; margin-top: 15px; font-weight: bold; text-align: center; }
    #close-btn { margin-top: 20px; padding: 12px 25px; background: white; border-radius: 5px; border: none; font-weight: bold; }
  </style>
</head>

<body>

  <button id="shoot" disabled>読み込み中...</button>

  <div id="preview-container">
    <img id="preview-image" src="">
    <div id="preview-text">画像を長押しして保存してください</div>
    <button id="close-btn">閉じる</button>
  </div>

  <a-scene
    embedded
    mindar-image="imageTargetSrc: ./bbs.mind; uiScanning: yes;"
    renderer="preserveDrawingBuffer: true; alpha: true; colorManagement: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img id="heart-img" src="heart.png">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0" id="target0"><a-entity class="fountain"></a-entity></a-entity>
    <a-entity mindar-image-target="targetIndex: 1" id="target1"><a-entity class="fountain"></a-entity></a-entity>
    <a-entity mindar-image-target="targetIndex: 2" id="target2"><a-entity class="fountain"></a-entity></a-entity>

  </a-scene>

  <script>
    const sceneEl = document.querySelector('a-scene');
    const shootBtn = document.getElementById('shoot');
    const previewContainer = document.getElementById('preview-container');
    const previewImage = document.getElementById('preview-image');
    const closeBtn = document.getElementById('close-btn');

    let arReady = false;
    let currentObjectUrl = null;

    // ハートを生成する関数
    function spawnHeart(targetId) {
      const targetEntity = document.getElementById(targetId);
      // ターゲットが見えている時だけ実行
      if (!targetEntity || !targetEntity.getAttribute('visible')) return;

      const container = targetEntity.querySelector('.fountain');
      const heart = document.createElement('a-entity');
      
      const size = 0.06 + Math.random() * 0.04;
      const startX = (Math.random() - 0.5) * 0.1;

      heart.setAttribute('geometry', { primitive: 'plane', width: size, height: size });
      heart.setAttribute('material', { src: '#heart-img', transparent: true, shader: 'flat', side: 'double' });
      heart.setAttribute('position', `${startX} 0 0`);
      
      const duration = 2000;
      const spreadX = (Math.random() - 0.5) * 0.6;

      heart.setAttribute('animation__up', {
        property: 'position', to: `${startX + spreadX * 0.2} 0.4 0`, dur: duration * 0.4, easing: 'easeOutQuad'
      });
      heart.setAttribute('animation__down', {
        property: 'position', to: `${startX + spreadX} -1.0 0`, delay: duration * 0.4, dur: duration * 0.6, easing: 'easeInQuad'
      });

      container.appendChild(heart);
      setTimeout(() => { if(heart.parentNode) heart.remove(); }, duration);
    }

    // 常時監視してハートを出す
    setInterval(() => {
      ['target0', 'target1', 'target2'].forEach(id => spawnHeart(id));
    }, 350);

    // 成功したコードの撮影ロジックを完全再現
    sceneEl.addEventListener('arReady', () => {
      arReady = true;
      shootBtn.disabled = false;
      shootBtn.innerText = "撮影する";
    });

    shootBtn.addEventListener('click', () => {
      if (!arReady) return;
      const video = document.querySelector('video');
      const glCanvas = sceneEl.canvas;
      const canvas = document.createElement('canvas');
      const dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      const ctx = canvas.getContext('2d');

      const vW = video.videoWidth;
      const vH = video.videoHeight;
      const videoAspect = vW / vH;
      const canvasAspect = canvas.width / canvas.height;
      
      let sx, sy, sw, sh;
      if (videoAspect > canvasAspect) {
        sw = vH * canvasAspect; sh = vH; sx = (vW - sw) / 2; sy = 0;
      } else {
        sw = vW; sh = vW / canvasAspect; sx = 0; sy = (vH - sh) / 2;
      }

      ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
      ctx.drawImage(glCanvas, 0, 0, canvas.width, canvas.height);

      canvas.toBlob((blob) => {
        if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = URL.createObjectURL(blob);
        previewImage.src = currentObjectUrl;
        previewContainer.style.display = 'flex';
      }, 'image/png');
    });

    closeBtn.addEventListener('click', () => {
      previewContainer.style.display = 'none';
    });
  </script>
</body>
</html>
