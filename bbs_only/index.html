<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>BBS Heart AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    #shoot {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 1000;
      padding: 15px 35px; font-size: 18px; font-weight: bold; border-radius: 50px;
      border: none; background: #ff4d6d; color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    #preview-container {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); z-index: 20000; flex-direction: column; align-items: center; justify-content: center;
    }
    #preview-image { max-width: 90%; max-height: 80%; border: 3px solid white; }
    #close-btn { margin-top: 20px; padding: 12px 25px; background: white; border-radius: 5px; border: none; font-weight: bold; }
  </style>
</head>

<body>

  <button id="shoot">撮影する</button>

  <div id="preview-container">
    <img id="preview-image" src="">
    <div style="color:white; margin-top:10px;">画像を長押しして保存</div>
    <button id="close-btn">閉じる</button>
  </div>

  <a-scene
    embedded
    /* 複数の.mindを読み込むため、実際のファイル構成に合わせて書き換えが必要な場合があります */
    mindar-image="imageTargetSrc: ./balloon.mind; uiScanning: yes;" 
    renderer="preserveDrawingBuffer: true; alpha: true;"
    vr-mode-ui="enabled: false">

    <a-assets>
      <img id="heart-img" src="heart.png">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0" id="target0"><a-entity class="fountain"></a-entity></a-entity>
    <a-entity mindar-image-target="targetIndex: 1" id="target1"><a-entity class="fountain"></a-entity></a-entity>
    <a-entity mindar-image-target="targetIndex: 2" id="target2"><a-entity class="fountain"></a-entity></a-entity>

  </a-scene>

  <script>
    const sceneEl = document.querySelector('a-scene');
    const shootBtn = document.getElementById('shoot');
    const previewContainer = document.getElementById('preview-container');
    const previewImage = document.getElementById('preview-image');
    const closeBtn = document.getElementById('close-btn');

    // ハート噴水
    function spawnHeart(targetEl) {
      if (!targetEl.object3D.visible) return;
      const heart = document.createElement('a-entity');
      const size = 0.04;
      heart.setAttribute('geometry', { primitive: 'plane', width: size, height: size });
      heart.setAttribute('material', { src: '#heart-img', transparent: true, shader: 'flat' });
      
      const startX = (Math.random() - 0.5) * 0.1;
      heart.setAttribute('position', `${startX} 0 0`);
      
      const duration = 2000;
      heart.setAttribute('animation__up', { property: 'position', to: `${startX} 0.2 0`, dur: duration * 0.3 });
      heart.setAttribute('animation__down', { property: 'position', to: `${startX + (Math.random()-0.5)} -0.8 0`, delay: duration * 0.3, dur: duration * 0.7 });

      targetEl.querySelector('.fountain').appendChild(heart);
      setTimeout(() => heart.remove(), duration);
    }

    setInterval(() => {
      [0,1,2].forEach(i => {
        const t = document.getElementById(`target${i}`);
        if(t) spawnHeart(t);
      });
    }, 300);

    // 撮影
    shootBtn.addEventListener('click', () => {
      const canvas = document.createElement('canvas');
      const video = document.querySelector('video');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0);
      ctx.drawImage(sceneEl.canvas, 0, 0, canvas.width, canvas.height);
      previewImage.src = canvas.toDataURL('image/png');
      previewContainer.style.display = 'flex';
    });

    closeBtn.addEventListener('click', () => previewContainer.style.display = 'none');
  </script>
</body>
</html>
