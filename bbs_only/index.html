<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>BBS Heart Fountain AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #shoot {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 1000;
      padding: 15px 35px; font-size: 18px; font-weight: bold; border-radius: 50px;
      border: none; background: #ff4d6d; color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      display: none; /* AR準備完了まで非表示 */
    }
    video { position: absolute; top: 0; left: 0; z-index: -2; }
  </style>
</head>

<body>

  <button id="shoot">撮影する</button>

  <a-scene
    embedded
    mindar-image="imageTargetSrc: ./bbs_only/targets.mind; uiScanning: yes; filterMinCF: 0.0001; filterBeta: 0.001;"
    renderer="preserveDrawingBuffer: true; alpha: true; colorManagement: true; antialias: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img id="heart-img" src="./heart.png">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0" id="target0"><a-entity class="fountain-container"></a-entity></a-entity>
    <a-entity mindar-image-target="targetIndex: 1" id="target1"><a-entity class="fountain-container"></a-entity></a-entity>
    <a-entity mindar-image-target="targetIndex: 2" id="target2"><a-entity class="fountain-container"></a-entity></a-entity>
    <a-entity mindar-image-target="targetIndex: 3" id="target3"><a-entity class="fountain-container"></a-entity></a-entity>
    <a-entity mindar-image-target="targetIndex: 4" id="target4"><a-entity class="fountain-container"></a-entity></a-entity>

  </a-scene>

  <script>
    const sceneEl = document.querySelector('a-scene');
    const shootBtn = document.getElementById('shoot');

    // ハートを1つ生成して噴水のように動かす関数
    function createHeart(targetEl) {
      // マーカーが見えていない時は生成しない
      if (!targetEl.object3D.visible) return;

      const heart = document.createElement('a-entity');
      
      // サイズと初期位置の微細なランダム化
      const size = 0.03 + Math.random() * 0.04;
      const startX = (Math.random() - 0.5) * 0.05;
      const startZ = (Math.random() - 0.5) * 0.05;
      
      heart.setAttribute('geometry', { primitive: 'plane', width: size, height: size });
      heart.setAttribute('material', { src: '#heart-img', transparent: true, shader: 'flat', side: 'double' });
      heart.setAttribute('position', `${startX} 0 ${startZ}`);

      // ターゲットの子要素として追加
      targetEl.querySelector('.fountain-container').appendChild(heart);

      // アニメーション設定
      const peakY = 0.1; // 10cm上昇
      const dropY = -0.6; // 60cm落下
      const spreadX = (Math.random() - 0.5) * 0.5; // 横への散らばり
      const spreadZ = (Math.random() - 0.5) * 0.5;
      const duration = 1500 + Math.random() * 1000;

      // 1. 噴き上がる動き
      heart.setAttribute('animation__up', {
        property: 'position',
        to: `${startX + spreadX * 0.3} ${peakY} ${startZ + spreadZ * 0.3}`,
        dur: duration * 0.4,
        easing: 'easeOutQuad'
      });

      // 2. 落ちる動き（放物線）
      heart.setAttribute('animation__down', {
        property: 'position',
        to: `${startX + spreadX} ${dropY} ${startZ + spreadZ}`,
        delay: duration * 0.4,
        dur: duration * 0.6,
        easing: 'easeInQuad'
      });

      // 3. 回転
      heart.setAttribute('animation__rot', {
        property: 'rotation',
        to: `0 0 ${Math.random() > 0.5 ? 360 : -360}`,
        dur: duration,
        easing: 'linear'
      });

      // アニメーションが終わったら消去
      heart.addEventListener('animationcomplete__down', () => {
        heart.remove();
      });
    }

    // 200msごとに全てのターゲットに対して生成を試みる
    setInterval(() => {
      for(let i=0; i<5; i++) {
        const target = document.getElementById(`target${i}`);
        if(target) createHeart(target);
      }
    }, 200);

    // AR準備完了でボタン表示
    sceneEl.addEventListener('arReady', () => {
      shootBtn.style.display = 'block';
    });

    // ※撮影（シャッター）機能が必要な場合は、以前のcanvas描画ロジックをここに追記可能です
  </script>
</body>
</html>
