<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>BBS Heart AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    /* UIデザインは元のまま維持 */
    #shoot { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 1000; padding: 15px 35px; font-size: 18px; font-weight: bold; border-radius: 50px; border: none; background: #ff4d6d; color: #fff; display: none; }
    #preview-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 20000; flex-direction: column; align-items: center; justify-content: center; }
    #preview-image { max-width: 90%; max-height: 80%; border: 3px solid white; }
    #close-btn { margin-top: 20px; padding: 12px 25px; background: white; border: none; font-weight: bold; }
  </style>
</head>
<body>
  <button id="shoot">撮影</button>
  <div id="preview-container">
    <img id="preview-image" src=""><button id="close-btn">閉じる</button>
  </div>

  <a-scene embedded mindar-image="imageTargetSrc: ./arch.mind;" renderer="preserveDrawingBuffer: true; alpha: true;" vr-mode-ui="enabled: false">
    <a-assets>
      <a-asset-item id="arch-obj" src="arch.obj"></a-asset-item>
      <a-asset-item id="arch-mtl" src="arch.mtl"></a-asset-item>
    </a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0" id="arch-target">
      <a-obj-model id="arch-model" src="#arch-obj" mtl="#arch-mtl" scale="0.5 0.5 0.5" position="0 -0.2 0"></a-obj-model>
    </a-entity>
  </a-scene>

  <script>
    const sceneEl = document.querySelector('a-scene');
    const shootBtn = document.getElementById('shoot');
    const targetEl = document.getElementById('arch-target');
    let isFixed = false;

    sceneEl.addEventListener('renderstart', () => { shootBtn.style.display = 'block'; });

    // 【震え防止】一度認識したら、位置更新を停止してロックする
    targetEl.addEventListener("targetFound", () => {
      if (!isFixed) {
        // 少し待って安定させてから固定（必要に応じて調整）
        setTimeout(() => {
          isFixed = true; 
        }, 500);
      }
    });

    // 毎フレームの処理で、固定後は座標を更新させない
    sceneEl.addEventListener('tick', () => {
      if (isFixed) {
        // トラッキングによる自動移動を無効化（震えを止める）
        targetEl.object3D.matrixAutoUpdate = false;
      }
    });

    // 撮影処理（背景ビデオとOBJを合成）
    shootBtn.addEventListener('click', () => {
      sceneEl.renderer.render(sceneEl.object3D, sceneEl.camera);
      const canvas = document.createElement('canvas');
      canvas.width = window.innerWidth; canvas.height = window.innerHeight;
      const ctx = canvas.getContext('2d');
      
      // ビデオ（背景）を描画
      const video = document.querySelector('video');
      if (video) {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      }
      // OBJ（Canvas）を描画
      ctx.drawImage(sceneEl.canvas, 0, 0, canvas.width, canvas.height);
      
      document.getElementById('preview-image').src = canvas.toDataURL('image/png');
      document.getElementById('preview-container').style.display = 'flex';
    });

    document.getElementById('close-btn').onclick = () => document.getElementById('preview-container').style.display = 'none';
  </script>
</body>
</html>
