<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Heart AR - Double Layer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

  <div style="position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:1000; display:flex; gap:20px;">
    <button id="lock" style="padding:12px 20px; border-radius:10px; border:none; background:#4CAF50; color:white; font-weight:bold;">位置を固定</button>
    <button id="capture" style="width:70px; height:70px; border-radius:50%; border:5px solid white; background:#ff4b5c;"></button>
  </div>

  <a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false;" 
    vr-mode-ui="enabled: false"
    renderer="preserveDrawingBuffer: true; alpha: true; antialias: true;">

    <a-marker preset="hiro" id="marker">
      <a-entity id="ar-content">
        <a-entity 
          id="arch-model"
          gltf-model="url(https://bbs-event-dining.github.io/bbs.github.io/arch/arch.glb)" 
          position="0 0 0">
        </a-entity>

        <a-entity id="static-hearts">
          <a-entity gltf-model="url(https://bbs-event-dining.github.io/bbs.github.io/arch/heart_F.glb)" position="0.15 0.02 0.15" rotation="-90 0 0" scale="0.08 0.08 0.08"></a-entity>
          <a-entity gltf-model="url(https://bbs-event-dining.github.io/bbs.github.io/arch/heart_F.glb)" position="-0.15 0.02 0.15" rotation="-90 45 0" scale="0.08 0.08 0.08"></a-entity>
          <a-entity gltf-model="url(https://bbs-event-dining.github.io/bbs.github.io/arch/heart_F.glb)" position="0.15 0.02 -0.15" rotation="-90 -45 0" scale="0.08 0.08 0.08"></a-entity>
          <a-entity gltf-model="url(https://bbs-event-dining.github.io/bbs.github.io/arch/heart_F.glb)" position="-0.15 0.02 -0.15" rotation="-90 90 0" scale="0.08 0.08 0.08"></a-entity>
        </a-entity>

        <a-entity id="heart-container"></a-entity>
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

<script>
  const marker = document.querySelector('#marker');
  const content = document.querySelector('#ar-content');
  const container = document.querySelector('#heart-container');
  const lockBtn = document.querySelector('#lock');
  const sceneEl = document.querySelector('a-scene');
  const HEART_URL = 'https://bbs-event-dining.github.io/bbs.github.io/arch/heart_F.glb';

  let isLocked = false;
  let heartInterval;

  function spawnHeart() {
    const heart = document.createElement('a-entity');
    const x = (Math.random() - 0.5) * 0.6;
    const z = (Math.random() - 0.5) * 0.6;
    const y0 = 0.05; 
    const y1 = y0 + 1.2;
    const s = 0.06; 

    heart.setAttribute('gltf-model', `url(${HEART_URL})`);
    heart.setAttribute('position', `${x} ${y0} ${z}`);
    heart.setAttribute('scale', `${s} ${s} ${s}`);
    heart.setAttribute('rotation', '-90 0 0');

    heart.setAttribute('animation__move', `property: position; to: ${x} ${y1} ${z}; dur: 2500; easing: easeOutQuad`);
    heart.setAttribute('animation__rot', `property: rotation; to: 0 0 0; dur: 1500; easing: easeOutQuad`);
    
    heart.addEventListener('animationcomplete__move', () => heart.remove());
    container.appendChild(heart);
  }

  marker.addEventListener('markerFound', () => {
    if (!heartInterval) heartInterval = setInterval(spawnHeart, 350);
  });

  // 固定ボタン
  lockBtn.addEventListener('click', () => {
    if (isLocked) {
      marker.appendChild(content);
      content.setAttribute('position', '0 0 0');
      content.setAttribute('rotation', '0 0 0');
      lockBtn.innerText = "位置を固定";
      isLocked = false;
    } else {
      const worldPos = new THREE.Vector3();
      const worldQuat = new THREE.Quaternion();
      const worldScale = new THREE.Vector3();
      content.object3D.updateMatrixWorld();
      content.object3D.getWorldPosition(worldPos);
      content.object3D.getWorldQuaternion(worldQuat);
      content.object3D.getWorldScale(worldScale);
      sceneEl.appendChild(content);
      content.object3D.position.copy(worldPos);
      content.object3D.quaternion.copy(worldQuat);
      content.object3D.scale.copy(worldScale);
      lockBtn.innerText = "固定解除";
      isLocked = true;
    }
  });

  // 撮影
  document.querySelector('#capture').addEventListener('click', () => {
    const video = document.querySelector('video');
    const canvas = sceneEl.canvas;
    
    // レンダリングが終わったタイミングで描画
    sceneEl.renderer.render(sceneEl.object3D, sceneEl.camera);

    const outputCanvas = document.createElement('canvas');
    outputCanvas.width = 1280; 
    outputCanvas.height = 720;
    const ctx = outputCanvas.getContext('2d');

    ctx.drawImage(video, 0, 0, outputCanvas.width, outputCanvas.height);
    ctx.drawImage(canvas, 0, 0, outputCanvas.width, outputCanvas.height);

    const link = document.createElement('a');
    link.href = outputCanvas.toDataURL('image/png');
    link.download = `AR_Heart_Scene.png`;
    link.click();
  });
</script>
</body>
</html>
