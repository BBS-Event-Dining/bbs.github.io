<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>AR.js Test - Hiro Marker</title>
  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

  <a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false;"
    renderer="logarithmicDepthBuffer: true;">

    <a-marker preset="hiro">
      
      <a-box position="0 0.5 0" material="color: red; opacity: 0.5;"></a-box>

      <a-entity 
        gltf-model="url(https://bbs-event-dining.github.io/arch/arch.glb)" 
        position="0 0 0" 
        scale="1 1 1"
        on-model-error>
      </a-entity>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // モデル読み込みエラーをチェックするスクリプト
    document.querySelector('[gltf-model]').addEventListener('model-error', (e) => {
      console.error("モデルの読み込みに失敗しました:", e);
      alert("モデルが読み込めません。URLが正しいか確認してください。");
    });
  </script>

</body>
</html>
