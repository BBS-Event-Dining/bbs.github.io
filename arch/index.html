<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Index</title>
    <style>
        body { margin: 0; overflow: hidden; }
        #capture {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <button id="capture">撮影</button>

    <script type="module">
        import * as THREE from 'https://cdn.skypack.dev/three@0.150.0';

        // 撮影時にOBJが消えないよう preserveDrawingBuffer を追加
        const renderer = new THREE.WebGLRenderer({ 
            antialias: true,
            preserveDrawingBuffer: true 
        });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        // 縦向きに対応したアスペクト比
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

        let archOBJ = null;
        let isPositionFixed = false; // 震えないようにするためのフラグ

        // OBJ読み込み時の処理（ここに読み込みコードを統合してください）
        function onModelLoaded(loadedObj) {
            archOBJ = loadedObj;
            // 花びらを半分ぐらい小さく
            archOBJ.scale.set(0.5, 0.5, 0.5);
            scene.add(archOBJ);
        }

        // 位置更新ロジック
        function updatePosition(scanData) {
            // 一度位置が決まったら更新しない（ブルブル震えるのを防止）
            if (isPositionFixed || !archOBJ) return;

            const scanBottom = scanData.boundingBox.min.y;
            // 底辺から20cm（0.2）ぐらい低く
            archOBJ.position.y = scanBottom - 0.2;
            
            isPositionFixed = true; 
        }

        // 撮影ボタン（OBJが写るように修正）
        document.getElementById('capture').addEventListener('click', () => {
            const dataURL = renderer.domElement.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = 'capture.png';
            link.href = dataURL;
            link.click();
        });

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
