<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Heart AR - Hiro Marker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false">

  <!-- Hiroマーカー -->
  <a-marker preset="hiro">

    <!-- arch 固定 -->
    <a-entity 
      gltf-model="url(https://bbs-event-dining.github.io/arch/arch.glb)" 
      position="0 0 0" 
      scale="1 1 1">
    </a-entity>

    <!-- heart 湧き用コンテナ -->
    <a-entity id="heart-container"></a-entity>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
const container = document.querySelector('#heart-container');

function spawnHeart() {
  const heart = document.createElement('a-entity');

  // マーカー中心付近
  const x = (Math.random() - 0.5) * 0.3;
  const z = (Math.random() - 0.5) * 0.3;
  const y0 = 0.1;
  const y1 = y0 + 0.5;

  const s = 0.1;

  heart.setAttribute('gltf-model', 'url(https://bbs-event-dining.github.io/arch/heart_F.glb)');
  heart.setAttribute('position', `${x} ${y0} ${z}`);
  heart.setAttribute('scale', `${s} ${s} ${s}`);

  heart.setAttribute('animation__move', `
    property: position;
    to: ${x} ${y1} ${z};
    dur: 1000;
    easing: easeOutQuad
  `);

  heart.setAttribute('animation__scale', `
    property: scale;
    to: ${s*1.3} ${s*1.3} ${s*1.3};
    dur: 800;
    easing: easeOutBack
  `);

  heart.addEventListener('animationcomplete__move', () => heart.remove());
  container.appendChild(heart);
}

// 心を湧かせるループ
setInterval(spawnHeart, 300);

</script>
</body>
</html>
