<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://unpkg.com/aframe-particle-system-component@1.1.3/dist/aframe-particle-system-component.min.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    <a-scene 
      mindar-image="imageTargetSrc: https://bbs-event-dining.github.io/bbs.github.io/arch/arch_pic.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <a-asset-item id="archModel" src="https://bbs-event-dining.github.io/bbs.github.io/arch/arch.glb"></a-asset-item>
        <img id="hanabira" src="https://bbs-event-dining.github.io/bbs.github.io/arch/pink_hanabira.png">
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model src="#archModel" rotation="0 0 0" position="0 0 0" scale="0.5 0.5 0.5"></a-gltf-model>

        <a-entity 
          position="0 1 0" 
          particle-system="
            texture: #hanabira; 
            color: #ffffff; 
            size: 0.1; 
            velocityValue: 0 -0.5 0; 
            velocitySpread: 0.2 0 0.2; 
            accelerationValue: 0 -0.1 0; 
            particleCount: 50; 
            maxAge: 3; 
            blending: 1">
        </a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
