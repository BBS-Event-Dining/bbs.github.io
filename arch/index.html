<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Heart AR - Position Lock</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

  <div style="position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:1000; display:flex; gap:20px; align-items:center;">
    <button id="lock" style="padding:10px 20px; border-radius:10px; border:none; background:#4CAF50; color:white; font-weight:bold; box-shadow:0 4px 10px rgba(0,0,0,0.3);">位置を固定</button>
    <button id="capture" style="width:70px; height:70px; border-radius:50%; border:5px solid white; background:#ff4b5c; box-shadow: 0 4px 15px rgba(0,0,0,0.4);"></button>
  </div>

  <a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false;" 
    vr-mode-ui="enabled: false"
    renderer="preserveDrawingBuffer: true; alpha: true; antialias: true;">

    <a-marker preset="hiro" id="marker">
      <a-entity id="ar-content">
        <a-entity 
          id="arch-model"
          gltf-model="url(https://bbs-event-dining.github.io/bbs.github.io/arch/arch.glb)" 
          position="0 0 0" 
          scale="1 1 1">
        </a-entity>
        <a-entity id="heart-container"></a-entity>
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

<script>
  const marker = document.querySelector('#marker');
  const content = document.querySelector('#ar-content');
  const container = document.querySelector('#heart-container');
  const lockBtn = document.querySelector('#lock');
  const HEART_URL = 'https://bbs-event-dining.github.io/bbs.github.io/arch/heart_F.glb';

  let isLocked = false;
  let heartInterval;

  // ハート生成
  function spawnHeart() {
    const heart = document.createElement('a-entity');
    const x = (Math.random() - 0.5) * 0.4;
    const z = (Math.random() - 0.5) * 0.4;
    const y0 = 0.2;
    const y1 = y0 + 0.7;
    const s = 0.1;

    heart.setAttribute('gltf-model', `url(${HEART_URL})`);
    heart.setAttribute('position', `${x} ${y0} ${z}`);
    heart.setAttribute('scale', `${s} ${s} ${s}`);
    heart.setAttribute('animation__move', `property: position; to: ${x} ${y1} ${z}; dur: 1200; easing: easeOutQuad`);
    heart.setAttribute('animation__scale', `property: scale; to: ${s*1.5} ${s*1.5} ${s*1.5}; dur: 800; easing: easeOutBack`);
    heart.addEventListener('animationcomplete__move', () => heart.remove());
    container.appendChild(heart);
  }

  // マーカー制御
  marker.addEventListener('markerFound', () => {
    if (!heartInterval) heartInterval = setInterval(spawnHeart, 300);
  });
  marker.addEventListener('markerLost', () => {
    if (!isLocked) {
      clearInterval(heartInterval);
      heartInterval = null;
    }
  });

  // --- 位置固定ロジック ---
  lockBtn.addEventListener('click', () => {
    if (isLocked) {
      // リセット（再度マーカー追従へ）
      marker.appendChild(content);
      content.setAttribute('position', '0 0 0');
      content.setAttribute('rotation', '0 0 0');
      lockBtn.innerText = "位置を固定";
      lockBtn.style.background = "#4CAF50";
      isLocked = false;
    } else {
      // 固定（マーカーの世界からシーンの世界へ）
      const worldPos = new THREE.Vector3();
      const worldQuat = new THREE.Quaternion();
      const worldScale = new THREE.Vector3();
      
      content.object3D.getWorldPosition(worldPos);
      content.object3D.getWorldQuaternion(worldQuat);
      content.object3D.getWorldScale(worldScale);

      document.querySelector('a-scene').appendChild(content);
      
      content.object3D.position.copy(worldPos);
      content.object3D.quaternion.copy(worldQuat);
      content.object3D.scale.copy(worldScale);

      lockBtn.innerText = "固定解除";
      lockBtn.style.background = "#f44336";
      isLocked = true;
    }
  });

  // --- 合成撮影 ---
  document.querySelector('#capture').addEventListener('click', () => {
    const sceneEl = document.querySelector('a-scene');
    const video = document.querySelector('video');
    const canvas = sceneEl.canvas;
    if (!video || !canvas) return;

    const outputCanvas = document.createElement('canvas');
    outputCanvas.width = canvas.width;
    outputCanvas.height = canvas.height;
    const ctx = outputCanvas.getContext('2d');
    ctx.drawImage(video, 0, 0, outputCanvas.width, outputCanvas.height);
    ctx.drawImage(canvas, 0, 0, outputCanvas.width, outputCanvas.height);

    const a = document.createElement('a');
    a.href = outputCanvas.toDataURL('image/png');
    a.download = `Heart_AR_Fixed.png`;
    a.click();
  });
</script>
</body>
</html>
