<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Heart AR Fountain - Hiro</title>

  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; overflow:hidden;">
<a-scene
  embedded
  vr-mode-ui="enabled:false"
  arjs="sourceType: webcam; debugUIEnabled:false;"
>

  <a-marker preset="hiro" id="marker">

    <!-- arch -->
    <a-entity
      gltf-model="url(https://bbs-event-dining.github.io/arch/arch.glb)"
      scale="2 2 2">
    </a-entity>

    <!-- マーカー隠し -->
    <a-entity
      gltf-model="url(https://bbs-event-dining.github.io/arch/heart_F.glb)"
      position="0 0.01 0"
      scale="0.05 0.05 0.05">
    </a-entity>

    <!-- 湧き用 -->
    <a-entity id="heart-container"></a-entity>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
  const marker = document.querySelector('#marker');
  let interval = null;

  marker.addEventListener('markerFound', () => {
    if (interval) return;

    const container = document.querySelector('#heart-container');

    interval = setInterval(() => {
      const heart = document.createElement('a-entity');

      const x = (Math.random() - 0.5) * 0.2;
      const z = (Math.random() - 0.5) * 0.2;
      const y0 = 0.05;
      const y1 = y0 + 0.8 + Math.random() * 0.3;

      const s = 0.04 + Math.random() * 0.04;

      heart.setAttribute('gltf-model',
        'url(https://bbs-event-dining.github.io/arch/heart_F.glb)');
      heart.setAttribute('position', `${x} ${y0} ${z}`);
      heart.setAttribute('scale', `${s} ${s} ${s}`);

      heart.setAttribute('animation', `
        property: position;
        to: ${x} ${y1} ${z};
        dur: 1200;
        easing: easeOutQuad
      `);

      heart.addEventListener('animationcomplete', () => {
        heart.remove();
      });

      container.appendChild(heart);
    }, 180);
  });

  marker.addEventListener('markerLost', () => {
    clearInterval(interval);
    interval = null;
  });
</script>

</body>
</html>
