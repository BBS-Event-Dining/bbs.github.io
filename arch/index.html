<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>AR Arch - Stable View</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #shoot {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 1000;
      padding: 15px 35px; font-size: 18px; font-weight: bold; border-radius: 50px;
      border: none; background: #ff4d6d; color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    video { position: absolute; top: 0; left: 0; z-index: -2; }
    #preview-container {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); z-index: 20000; flex-direction: column; align-items: center; justify-content: center;
    }
    #preview-image { max-width: 90%; max-height: 80%; border: 3px solid white; display: block; }
    #preview-text { color: white; margin-top: 15px; font-weight: bold; text-align: center; }
    #close-btn { margin-top: 20px; padding: 12px 25px; background: white; border-radius: 5px; border: none; font-weight: bold; }
  </style>
</head>

<body>

  <button id="shoot" disabled>読み込み中...</button>

  <div id="preview-container">
    <img id="preview-image" src="" alt="Captured Image">
    <div id="preview-text">画像を長押しして保存してください</div>
    <button id="close-btn">閉じる</button>
  </div>

  <a-scene
    embedded
    /* filterMinCF と filterBeta で震えを抑制 */
    mindar-image="imageTargetSrc: arch_pic.mind; uiScanning: yes; filterMinCF: 0.0001; filterBeta: 0.001;"
    renderer="preserveDrawingBuffer: true; alpha: true; colorManagement: true; antialias: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img id="petal-img" src="pink_hanabira.png">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
      <a-entity 
        id="arch-model"
        gltf-model="url(https://bbs-event-dining.github.io/bbs.github.io/arch/arch.glb)" 
        animation-mixer="clip: *; loop: repeat"
        position="0 -0.35 0" 
        scale="0.5 0.5 0.5">
      </a-entity>
      
      <a-entity id="petal-container"></a-entity>
    </a-entity>
  </a-scene>

  <script>
    const container = document.querySelector('#petal-container');
    const targetEntity = document.querySelector('#ar-target');
    const shootBtn = document.getElementById('shoot');
    const sceneEl = document.querySelector('a-scene');
    const previewContainer = document.getElementById('preview-container');
    const previewImage = document.getElementById('preview-image');
    const closeBtn = document.getElementById('close-btn');

    let arReady = false;
    let currentObjectUrl = null;

    function spawnPetal() {
      if (!targetEntity.object3D.visible) return;

      const petal = document.createElement('a-entity');
      const startX = (Math.random() - 0.5) * 0.8; 
      // アーチを下げた分、花びらの発生点も少し調整（0.15に）
      const startY = 0.15; 
      const startZ = (Math.random() - 0.5) * 0.3;
      const size = 0.04 + Math.random() * 0.04;

      petal.setAttribute('geometry', { primitive: 'plane', width: size, height: size });
      petal.setAttribute('material', { src: '#petal-img', transparent: true, side: 'double', shader: 'flat' });
      petal.setAttribute('position', `${startX} ${startY} ${startZ}`);
      
      const endY = -0.7;
      const duration = 2500 + Math.random() * 2000;
      
      petal.setAttribute('animation__move', {
        property: 'position',
        to: `${startX + (Math.random() - 0.5) * 0.3} ${endY} ${startZ}`,
        dur: duration,
        easing: 'linear'
      });

      petal.setAttribute('animation__rot', {
        property: 'rotation',
        from: '0 0 0',
        to: `${360 + Math.random() * 360} ${360 + Math.random() * 360} 0`,
        dur: duration,
        easing: 'linear'
      });

      petal.addEventListener('animationcomplete__move', () => petal.remove());
      container.appendChild(petal);
    }

    setInterval(spawnPetal, 350);

    sceneEl.addEventListener('arReady', () => {
      arReady = true;
      shootBtn.disabled = false;
      shootBtn.innerText = "撮影する";
    });

    shootBtn.addEventListener('click', () => {
      if (!arReady) return;
      const video = document.querySelector('video');
      const glCanvas = sceneEl.canvas;
      const canvas = document.createElement('canvas');
      const dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      const ctx = canvas.getContext('2d');

      const vW = video.videoWidth;
      const vH = video.videoHeight;
      const videoAspect = vW / vH;
      const canvasAspect = canvas.width / canvas.height;
      
      let sx, sy, sw, sh;
      if (videoAspect > canvasAspect) {
        sw = vH * canvasAspect; sh = vH; sx = (vW - sw) / 2; sy = 0;
      } else {
        sw = vW; sh = vW / canvasAspect; sx = 0; sy = (vH - sh) / 2;
      }

      ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
      sceneEl.renderer.render(sceneEl.object3D, sceneEl.camera);
      ctx.drawImage(glCanvas, 0, 0, canvas.width, canvas.height);

      canvas.toBlob((blob) => {
        if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = URL.createObjectURL(blob);
        previewImage.src = currentObjectUrl;
        previewContainer.style.display = 'flex';
      }, 'image/png');
    });

    closeBtn.addEventListener('click', () => {
      previewContainer.style.display = 'none';
      if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
      previewImage.src = "";
    });
  </script>
</body>
</html>
