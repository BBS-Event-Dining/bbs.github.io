<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Heart AR - Fixed URL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">

  <a-marker preset="hiro">
    <a-entity 
      id="arch-model"
      gltf-model="url(https://bbs-event-dining.github.io/bbs.github.io/arch/arch.glb)" 
      position="0 0 0" 
      scale="1 1 1">
    </a-entity>

    <a-entity id="heart-container"></a-entity>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
const container = document.querySelector('#heart-container');
const HEART_URL = 'https://bbs-event-dining.github.io/bbs.github.io/arch/heart_F.glb';

function spawnHeart() {
  const heart = document.createElement('a-entity');
  const x = (Math.random() - 0.5) * 0.4;
  const z = (Math.random() - 0.5) * 0.4;
  const y0 = 0.2;
  const y1 = y0 + 0.6;
  const s = 0.1;

  heart.setAttribute('gltf-model', `url(${HEART_URL})`);
  heart.setAttribute('position', `${x} ${y0} ${z}`);
  heart.setAttribute('scale', `${s} ${s} ${s}`);

  heart.setAttribute('animation__move', `property: position; to: ${x} ${y1} ${z}; dur: 1200; easing: easeOutQuad`);
  heart.setAttribute('animation__scale', `property: scale; to: ${s*1.5} ${s*1.5} ${s*1.5}; dur: 800; easing: easeOutBack`);

  heart.addEventListener('animationcomplete__move', () => heart.remove());
  container.appendChild(heart);
}

// マーカーが認識されたらハートを開始
document.querySelector('a-marker').addEventListener('markerFound', () => {
  if (!window.heartTimer) {
    window.heartTimer = setInterval(spawnHeart, 300);
  }
});

document.querySelector('a-marker').addEventListener('markerLost', () => {
  clearInterval(window.heartTimer);
  window.heartTimer = null;
});
</script>
</body>
</html>
