<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Arch AR Experience</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #shoot { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 1000; padding: 15px 45px; font-size: 18px; font-weight: bold; border-radius: 50px; border: none; background: #ffb6c1; color: #fff; display: none; text-shadow: 0 1px 2px rgba(0,0,0,0.2); box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    #preview-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 20000; flex-direction: column; align-items: center; justify-content: center; }
    #preview-image { max-width: 85%; max-height: 75%; border: 3px solid white; object-fit: contain; }
    .save-note { color: white; margin-bottom: 10px; font-size: 16px; font-weight: bold; }
    #close-btn { margin-top: 20px; padding: 12px 25px; background: white; border: none; font-weight: bold; cursor: pointer; border-radius: 5px; }
  </style>
</head>
<body>
  <button id="shoot">撮影</button>

  <div id="preview-container">
    <div class="save-note">長押しで保存</div>
    <img id="preview-image" src="">
    <button id="close-btn">閉じる</button>
  </div>

  <a-scene embedded 
    mindar-image="imageTargetSrc: https://bbs-event-dining.github.io/bbs.github.io/arch/arch_pic.mind;" 
    renderer="preserveDrawingBuffer: true; alpha: true; colorManagement: true; antialias: true;" 
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <a-asset-item id="arch-model" src="https://bbs-event-dining.github.io/bbs.github.io/arch/arch.glb"></a-asset-item>
      <img id="hanabira-img" src="https://bbs-event-dining.github.io/bbs.github.io/arch/pink_hanabira.png">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0" id="arch-target">
      <a-gltf-model src="#arch-model" rotation="0 0 0" position="0 -0.2 0" scale="0.5 0.5 0.5"></a-gltf-model>
      <a-entity id="hanabira-container"></a-entity>
    </a-entity>
  </a-scene>

  <script>
    const sceneEl = document.querySelector('a-scene');
    const shootBtn = document.getElementById('shoot');
    const targetEl = document.getElementById('arch-target');
    let isLocked = false;

    sceneEl.addEventListener('renderstart', () => {
      shootBtn.style.display = 'block';
    });

    targetEl.addEventListener("targetFound", () => {
      if (!isLocked) {
        setTimeout(() => {
          targetEl.object3D.matrixAutoUpdate = false; 
          isLocked = true;
        }, 500);
      }
    });

    function spawnHanabira() {
      const container = document.getElementById('hanabira-container');
      const target = document.getElementById('arch-target');
      if (!target.getAttribute('visible')) return;

      const leaf = document.createElement('a-entity');
      // OBJの横幅に合わせて範囲を少し狭める
      const startX = (Math.random() - 0.5) * 0.8;
      // 【修正】OBJの上部（0.3付近）から降らせる
      const startY = 0.3; 
      const startZ = (Math.random() - 0.5) * 0.5;

      leaf.setAttribute('geometry', { primitive: 'plane', width: 0.1, height: 0.1 });
      leaf.setAttribute('material', { src: '#hanabira-img', transparent: true, shader: 'flat', side: 'double' });
      leaf.setAttribute('position', `${startX} ${startY} ${startZ}`);
      
      leaf.setAttribute('animation__move', {
        property: 'position',
        to: `${startX + (Math.random()-0.5)*0.3} -0.8 ${startZ + (Math.random()-0.5)*0.3}`,
        dur: 4000 + (Math.random() * 2000),
        easing: 'linear'
      });

      leaf.setAttribute('animation__rotate', {
        property: 'rotation',
        to: `${Math.random()*360} ${Math.random()*360} ${Math.random()*360}`,
        dur: 5000,
        loop: true
      });

      leaf.setAttribute('animation__fade', {
        property: 'material.opacity',
        from: 1, to: 0, dur: 4000 + (Math.random() * 2000), easing: 'easeInQuad'
      });

      container.appendChild(leaf);
      setTimeout(() => leaf.remove(), 6000);
    }

    setInterval(spawnHanabira, 300);

    // 【修正】縦向き撮影に対応
    shootBtn.addEventListener('click', () => {
      sceneEl.renderer.render(sceneEl.object3D, sceneEl.camera);
      
      const video = document.querySelector('video');
      const canvas = document.createElement('canvas');
      
      // スクリーン上の実際の表示サイズ（縦長）に合わせる
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      
      const ctx = canvas.getContext('2d');
      
      // ビデオを画面いっぱいに描画（アスペクト比を維持して中央を切り取る）
      const videoAspect = video.videoWidth / video.videoHeight;
      const canvasAspect = canvas.width / canvas.height;
      let sx, sy, sw, sh;

      if (videoAspect > canvasAspect) {
        sw = video.videoHeight * canvasAspect;
        sh = video.videoHeight;
        sx = (video.videoWidth - sw) / 2;
        sy = 0;
      } else {
        sw = video.videoWidth;
        sh = video.videoWidth / canvasAspect;
        sx = 0;
        sy = (video.videoHeight - sh) / 2;
      }
      
      ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
      ctx.drawImage(sceneEl.canvas, 0, 0, canvas.width, canvas.height);
      
      document.getElementById('preview-image').src = canvas.toDataURL('image/png');
      document.getElementById('preview-container').style.display = 'flex';
    });

    document.getElementById('close-btn').onclick = () => {
      document.getElementById('preview-container').style.display = 'none';
    };
  </script>
</body>
</html>
