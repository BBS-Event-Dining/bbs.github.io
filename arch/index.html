<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Arch Heart AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #shoot {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 1000;
      padding: 15px 35px; font-size: 18px; font-weight: bold; border-radius: 50px;
      border: none; background: #ff4d6d; color: #fff; display: none;
    }
    #preview-container {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); z-index: 20000; flex-direction: column; align-items: center; justify-content: center;
    }
    #preview-image { max-width: 90%; max-height: 80%; border: 3px solid white; }
    #close-btn { margin-top: 20px; padding: 12px 25px; background: white; border: none; font-weight: bold; }
  </style>
</head>
<body>
  <button id="shoot">撮影する</button>
  <div id="preview-container">
    <img id="preview-image" src=""><button id="close-btn">閉じる</button>
  </div>

  <a-scene embedded mindar-image="imageTargetSrc: ./arch.mind;" renderer="preserveDrawingBuffer: true; alpha: true;" vr-mode-ui="enabled: false">
    <a-assets>
      <img id="heart-img" src="heart.png">
      <a-asset-item id="arch-model" src="arch.glb"></a-asset-item>
    </a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-gltf-model src="#arch-model" rotation="0 0 0" position="0 0 0" scale="1 1 1"></a-gltf-model>
      <a-entity id="heart-container"></a-entity>
    </a-entity>
  </a-scene>

  <script>
    const sceneEl = document.querySelector('a-scene');
    const shootBtn = document.getElementById('shoot');
    
    // 読み込み完了でボタンを表示
    sceneEl.addEventListener('renderstart', () => { shootBtn.style.display = 'block'; });

    function spawnHeart() {
      const container = document.getElementById('heart-container');
      const target = container.closest('[mindar-image-target]');
      if (!target.getAttribute('visible')) return;

      const heart = document.createElement('a-entity');
      const startX = (Math.random() - 0.5) * 0.5; // 広い範囲
      const startZ = (Math.random() - 0.5) * 0.5;
      
      heart.setAttribute('geometry', { primitive: 'plane', width: 0.08, height: 0.08 });
      heart.setAttribute('material', { src: '#heart-img', transparent: true, shader: 'flat' });
      
      // 上部(1.5m)から落下
      heart.setAttribute('position', `${startX} 1.5 ${startZ}`);
      heart.setAttribute('animation__move', {
        property: 'position', to: `${startX} -0.2 ${startZ}`, dur: 3000, easing: 'linear'
      });
      heart.setAttribute('animation__fade', {
        property: 'material.opacity', from: 1, to: 0, dur: 3000
      });

      container.appendChild(heart);
      setTimeout(() => heart.remove(), 3000);
    }
    setInterval(spawnHeart, 300);

    // 撮影処理（共通）
    shootBtn.addEventListener('click', () => {
      sceneEl.renderer.render(sceneEl.object3D, sceneEl.camera);
      const canvas = document.createElement('canvas');
      canvas.width = window.innerWidth; canvas.height = window.innerHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(document.querySelector('video'), 0, 0, canvas.width, canvas.height);
      ctx.drawImage(sceneEl.canvas, 0, 0, canvas.width, canvas.height);
      document.getElementById('preview-image').src = canvas.toDataURL('image/png');
      document.getElementById('preview-container').style.display = 'flex';
    });
    document.getElementById('close-btn').onclick = () => document.getElementById('preview-container').style.display = 'none';
  </script>
</body>
</html>
