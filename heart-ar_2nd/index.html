<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Heart AR Frame</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

  <script>
    /* ===============================
       frame内からheartを出す（確定版）
    =============================== */
    AFRAME.registerComponent('frame-heart-emitter', {
      init: function () {
        const frameEl = this.el;

        frameEl.addEventListener('model-loaded', () => {
          const mesh = frameEl.getObject3D('mesh');
          if (!mesh) return;

          mesh.updateMatrixWorld(true);

          const box = new THREE.Box3().setFromObject(mesh);

          // 初期5個
          for (let i = 0; i < 5; i++) {
            this.spawnHeart(box);
          }

          // 定期生成
          setInterval(() => {
            this.spawnHeart(box);
          }, 1000);
        });
      },

      spawnHeart: function (box) {
        const x = THREE.MathUtils.lerp(box.min.x + 0.05, box.max.x - 0.05, Math.random());
        const y = THREE.MathUtils.lerp(box.min.y + 0.05, box.max.y - 0.05, Math.random());
        const z = box.max.z + 0.02; // frameの"手前"

        const heart = document.createElement('a-entity');
        heart.setAttribute('gltf-model', '#heartModel');
        heart.setAttribute('position', `${x} ${y} ${z}`);
        heart.setAttribute('scale', '0.15 0.15 0.15');
        heart.setAttribute('floating-heart', '');

        /* 💡 ツヤ専用ライト（強制的に効かせる） */
        const glossLight = document.createElement('a-light');
        glossLight.setAttribute('type', 'point');
        glossLight.setAttribute('intensity', '0.9');
        glossLight.setAttribute('distance', '2');
        glossLight.setAttribute('decay', '1');
        glossLight.setAttribute('position', '0 0 0.15');

        heart.appendChild(glossLight);

        /* ★ 最重要：frameの子にする */
        this.el.appendChild(heart);
      }
    });

    /* ===============================
       heart浮遊
    =============================== */
    AFRAME.registerComponent('floating-heart', {
      tick: function (time, delta) {
        const obj = this.el.object3D;
        obj.position.y += delta * 0.0003;
        obj.rotation.y += delta * 0.0006;
      }
    });
  </script>
</head>

<body style="margin:0; overflow:hidden;">

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  arjs="sourceType: webcam; debugUIEnabled: false;"
  renderer="colorManagement: true; exposure: 1.6;"
>

  <a-assets>
    <a-asset-item id="frameModel" src="frame.glb"></a-asset-item>
    <a-asset-item id="heartModel" src="heart.glb"></a-asset-item>
  </a-assets>

  <a-marker preset="hiro">

    <a-light type="ambient" intensity="1.44"></a-light>
    <a-light type="directional" position="0 1 1" intensity="0.96"></a-light>

    <a-entity
      id="frame"
      gltf-model="#frameModel"
      position="0 0 -0.5"
      scale="3.2 3.2 3.2"
      frame-heart-emitter>
    </a-entity>

  </a-marker>

  <a-entity camera></a-entity>

</a-scene>

</body>
</html>
