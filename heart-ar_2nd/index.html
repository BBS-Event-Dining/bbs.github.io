<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AR Frame Capture</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: black;
  }

  #camera {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* frame（今までの半分サイズ） */
  #frame {
    position: fixed;
    inset: 0;
    margin: auto;
    width: 50vw;
    height: 50vw;
    max-width: 300px;
    max-height: 300px;
    border: 6px solid white;
    box-sizing: border-box;
    pointer-events: none;
  }

  #shoot {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: white;
    border: none;
  }
</style>
</head>

<body>

<video id="camera" autoplay playsinline></video>
<div id="frame"></div>
<button id="shoot"></button>

<!-- 保存用canvas（非表示） -->
<canvas id="capture" style="display:none;"></canvas>

<script>
const video = document.getElementById("camera");
const frame = document.getElementById("frame");
const canvas = document.getElementById("capture");
const ctx = canvas.getContext("2d");

// カメラ起動
navigator.mediaDevices.getUserMedia({
  video: { facingMode: "environment" },
  audio: false
}).then(stream => {
  video.srcObject = stream;
});

// 撮影処理
document.getElementById("shoot").onclick = () => {
  const vw = video.videoWidth;
  const vh = video.videoHeight;

  canvas.width = vw;
  canvas.height = vh;

  // ① カメラ映像
  ctx.drawImage(video, 0, 0, vw, vh);

  // ② frame合成
  const rect = frame.getBoundingClientRect();
  const scaleX = vw / window.innerWidth;
  const scaleY = vh / window.innerHeight;

  ctx.strokeStyle = "white";
  ctx.lineWidth = 12;
  ctx.strokeRect(
    rect.left * scaleX,
    rect.top * scaleY,
    rect.width * scaleX,
    rect.height * scaleY
  );

  // 保存
  const a = document.createElement("a");
  a.href = canvas.toDataURL("image/png");
  a.download = "ar_capture.png";
  a.click();
};
</script>

</body>
</html>
