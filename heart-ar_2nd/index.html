<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Heart Fountain AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
  <!-- AR.js -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

  <!-- ハート噴水用コンポーネント -->
  <script>
    AFRAME.registerComponent('heart-fountain', {
      init: function () {
        this.spawnHeart();
        setInterval(() => {
          this.spawnHeart();
        }, 300); // 噴水感（数値小さいほど多い）
      },

      spawnHeart: function () {
        const heart = document.createElement('a-entity');

        // ランダムばらけ
        const x = (Math.random() - 0.5) * 0.4;
        const z = (Math.random() - 0.5) * 0.4;
        const scale = 0.15 + Math.random() * 0.15;

        heart.setAttribute('gltf-model', 'url(heart.glb)');
        heart.setAttribute('position', `${x} 0 ${z}`);
        heart.setAttribute('scale', `${scale} ${scale} ${scale}`);

        // 上＋手前にふんわり噴き出す
        heart.setAttribute('animation__move', {
          property: 'position',
          to: `${x} ${1.2 + Math.random()} ${z - 0.8}`,
          dur: 3000,
          easing: 'easeOutQuad'
        });

        // フェードアウト
        heart.setAttribute('animation__fade', {
          property: 'material.opacity',
          to: 0,
          dur: 3000,
          easing: 'linear'
        });

        heart.setAttribute('material', {
          transparent: true,
          opacity: 1
        });

        this.el.appendChild(heart);

        // 軽量化：一定時間で削除
        setTimeout(() => {
          heart.remove();
        }, 3200);
      }
    });
  </script>
</head>

<body style="margin:0; overflow:hidden;">
  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    renderer="logarithmicDepthBuffer: true;"
  >

    <!-- Hiro マーカー -->
    <a-marker preset="hiro">

      <!-- 額縁 -->
      <a-entity
        gltf-model="url(frame.glb)"
        scale="1 1 1"
        position="0 0 0"
      ></a-entity>

      <!-- ハート噴水 -->
      <a-entity
        position="0 0.1 0"
        heart-fountain
      ></a-entity>

    </a-marker>

    <!-- カメラ -->
    <a-entity camera></a-entity>

  </a-scene>
</body>
</html>
