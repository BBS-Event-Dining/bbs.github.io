<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Valentine Marker AR</title>

<script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

<style>
body { margin:0; overflow:hidden; background:#000; }

#shoot {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  padding: 14px 28px;
  border-radius: 30px;
  border: none;
  font-size: 16px;
  background: #ff4d6d;
  color: #fff;
}
</style>
</head>

<body>

<button id="shoot">📸 撮影</button>
<canvas id="capture" style="display:none;"></canvas>

<a-scene
  embedded
  vr-mode-ui="enabled:false"
  arjs="sourceType:webcam; debugUIEnabled:false;"
  renderer="colorManagement:true; exposure:1.3;"
>

  <!-- Marker -->
  <a-marker preset="hiro">

    <!-- Lights -->
    <a-light type="ambient" intensity="1.4"></a-light>
    <a-light type="directional" position="0 2 1" intensity="1.0"></a-light>

    <!-- Frame -->
    <a-entity
      id="frame"
      gltf-model="url(frame.glb)"
      position="0 0 -0.6"
      scale="2.4 2.4 2.4">
    </a-entity>

    <!-- Hearts -->
    <a-entity id="heartContainer"></a-entity>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
/* ========= heart spawn ========= */
const heartContainer = document.getElementById("heartContainer");

setInterval(() => {
  const h = document.createElement("a-entity");
  h.setAttribute("gltf-model", "url(heart.glb)");

  const x = (Math.random() - 0.5) * 1.2;
  h.setAttribute("position", `${x} 0 -0.6`);
  h.setAttribute("scale", "0.28 0.28 0.28");

  h.addEventListener("model-loaded", e => {
    e.detail.model.traverse(o => {
      if (o.isMesh) {
        o.material.metalness = 0.7;
        o.material.roughness = 0.15;
      }
    });
  });

  h.setAttribute("animation", {
    property: "position",
    to: `${x} 1.1 -0.6`,
    dur: 2400,
    easing: "easeOutQuad"
  });

  heartContainer.appendChild(h);
  setTimeout(() => h.remove(), 2600);
}, 700);

/* ========= capture ========= */
document.getElementById("shoot").onclick = () => {

  const video = document.querySelector("video");
  if (!video || video.videoWidth === 0) {
    alert("カメラ準備中です");
    return;
  }

  const w = Math.min(video.videoWidth, 1920);
  const h = Math.min(video.videoHeight, 1080);

  const canvas = document.getElementById("capture");
  const ctx = canvas.getContext("2d");
  canvas.width = w;
  canvas.height = h;

  // 実写
  ctx.drawImage(video, 0, 0, w, h);

  // AR
  const arCanvas =
    document.querySelector("a-scene").renderer.domElement;
  ctx.drawImage(arCanvas, 0, 0, w, h);

  const a = document.createElement("a");
  a.href = canvas.toDataURL("image/png");
  a.download = "valentine_ar.png";
  a.click();
};
</script>

</body>
</html>
