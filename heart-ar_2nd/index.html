<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Heart AR Frame</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  arjs="
    sourceType: webcam;
    debugUIEnabled: false;
  "
  renderer="
    colorManagement: true;
    physicallyCorrectLights: false;
    exposure: 1.6;
  "
>

  <!-- Hiro Marker -->
  <a-marker preset="hiro">

    <!-- 🌞 環境光（超重要） -->
    <a-light
      type="ambient"
      intensity="1.8">
    </a-light>

    <!-- 🌞 正面ライト -->
    <a-light
      type="directional"
      position="0 1 1"
      intensity="1.2">
    </a-light>

    <!-- 額縁（Pixel7a 縦フル想定） -->
    <a-entity
      id="frame"
      gltf-model="url(frame.glb)"
      position="0 0 -0.5"
      scale="3.2 3.2 3.2">
    </a-entity>

  </a-marker>

  <!-- カメラ -->
  <a-entity camera></a-entity>

</a-scene>

</body>
</html>
