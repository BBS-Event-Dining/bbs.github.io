<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Valentine Heart AR</title>

<script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: #000;
}
</style>
</head>

<body>

<a-scene
  embedded
  vr-mode-ui="enabled:false"
  arjs="sourceType:webcam; debugUIEnabled:false;"
  renderer="colorManagement:true; physicallyCorrectLights:true; exposure:1.35;"
>

  <!-- ===== Lights（艶用・最重要） ===== -->
  <a-light type="ambient" intensity="1.8"></a-light>
  <a-light type="directional" position="0 3 2" intensity="2.4"></a-light>

  <!-- ===== Marker ===== -->
  <a-marker preset="hiro">

    <!-- Frame -->
    <a-entity
      id="frame"
      gltf-model="url(frame.glb)"
      scale="1.6 1.6 1.6"
      position="0 0 0">
    </a-entity>

    <!-- Hearts container -->
    <a-entity id="heartContainer"></a-entity>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
/* ===============================
   Heart effect : ふわふわ＋艶
================================ */

const heartContainer = document.getElementById("heartContainer");

setInterval(() => {

  const heart = document.createElement("a-entity");
  heart.setAttribute("gltf-model", "url(heart.glb)");

  // 出現位置（frame内ランダム）
  const x = (Math.random() - 0.5) * 0.9;
  heart.setAttribute("position", `${x} -0.25 0`);
  heart.setAttribute("scale", "0.28 0.28 0.28");

  // 艶マテリアル強制
  heart.addEventListener("model-loaded", e => {
    e.detail.model.traverse(o => {
      if (o.isMesh) {
        o.material.metalness = 0.9;
        o.material.roughness = 0.08;
        o.material.envMapIntensity = 2.0;

        // ほんのり自己発光（キラッ感）
        o.material.emissive.setRGB(0.35, 0.06, 0.12);
        o.material.emissiveIntensity = 0.6;

        o.material.needsUpdate = true;
      }
    });
  });

  // 上昇（ふわっ）
  heart.setAttribute("animation__up", {
    property: "position",
    to: `${x} 1.3 0`,
    dur: 3200,
    easing: "easeOutSine"
  });

  // 回転（浮遊感）
  heart.setAttribute("animation__rot", {
    property: "rotation",
    to: "0 360 0",
    dur: 6000,
    loop: true,
    easing: "linear"
  });

  // フェードアウト（縮小）
  heart.setAttribute("animation__fade", {
    property: "scale",
    to: "0.15 0.15 0.15",
    dur: 3200,
    easing: "easeInQuad"
  });

  heartContainer.appendChild(heart);

  // 後始末
  setTimeout(() => {
    heart.remove();
  }, 3400);

}, 650);
</script>

</body>
</html>
