<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Valentine Marker AR</title>

<script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: #000;
}

/* AR表示はすべてタップ無効 */
a-scene,
video,
canvas {
  pointer-events: none;
}

/* UIのみタップ有効 */
#ui {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  pointer-events: auto;
}

#shoot {
  padding: 14px 28px;
  border-radius: 30px;
  border: none;
  font-size: 16px;
  background: #ff4d6d;
  color: #fff;
  touch-action: manipulation;
}
</style>
</head>

<body>

<div id="ui">
  <button id="shoot">📸 撮影</button>
</div>

<canvas id="capture" style="display:none;"></canvas>

<a-scene
  embedded
  vr-mode-ui="enabled:false"
  arjs="sourceType:webcam; debugUIEnabled:false;"
  renderer="colorManagement:true; exposure:1.3;"
>

  <a-marker preset="hiro">

    <!-- light -->
    <a-light type="ambient" intensity="1.4"></a-light>
    <a-light type="directional" position="0 1 1" intensity="1.0"></a-light>

    <!-- frame（正しいサイズ） -->
    <a-entity
      id="frame"
      gltf-model="url(frame.glb)"
      position="0 0 0"
      scale="0.7 0.7 0.7">
    </a-entity>

    <!-- hearts -->
    <a-entity id="heartContainer"></a-entity>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
/* =========================
   heart生成
========================= */
const heartContainer = document.getElementById("heartContainer");

setInterval(() => {
  const heart = document.createElement("a-entity");
  heart.setAttribute("gltf-model", "url(heart.glb)");

  const x = (Math.random() - 0.5) * 0.6;
  const y = Math.random() * 0.4 + 0.2;

  heart.setAttribute("position", `${x} ${y} 0`);
  heart.setAttribute("scale", "0.18 0.18 0.18");

  heart.addEventListener("model-loaded", e => {
    e.detail.model.traverse(o => {
      if (o.isMesh) {
        o.material.metalness = 0.7;
        o.material.roughness = 0.15;
      }
    });
  });

  heart.setAttribute("animation", {
    property: "position",
    to: `${x} ${y + 0.5} 0`,
    dur: 2200,
    easing: "easeOutQuad"
  });

  heartContainer.appendChild(heart);
  setTimeout(() => heart.remove(), 2300);
}, 700);

/* =========================
   撮影（marker用・確定）
========================= */
const canvas = document.getElementById("capture");
const ctx = canvas.getContext("2d");
const video = document.querySelector("video");
const shootBtn = document.getElementById("shoot");

let videoReady = false;
video.addEventListener("canplay", () => videoReady = true);

function shoot(e) {
  e.preventDefault();

  if (!videoReady) {
    alert("カメラ準備中です");
    return;
  }

  const w = video.videoWidth;
  const h = video.videoHeight;

  canvas.width = w;
  canvas.height = h;

  // marker使用時は video を撮ればARも写る
  ctx.drawImage(video, 0, 0, w, h);

  const a = document.createElement("a");
  a.href = canvas.toDataURL("image/png");
  a.download = "valentine_marker_ar.png";
  a.click();
}

shootBtn.addEventListener("touchstart", shoot, { passive:false });
shootBtn.addEventListener("click", shoot);
</script>

</body>
</html>
