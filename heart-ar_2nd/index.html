<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Heart AR Frame</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

  <script>
    /* ===============================
       frame内部ランダム散布Emitter
       修正版：必ずframe内にspawn
    =============================== */
    AFRAME.registerComponent('frame-heart-emitter', {
      init: function () {
        const frameEl = this.el;
        const sceneEl = frameEl.sceneEl;

        frameEl.addEventListener('model-loaded', () => {
          const frameObj = frameEl.getObject3D('mesh');
          if (!frameObj) {
            console.warn('Frame object not ready');
            return;
          }

          // ワールド行列更新
          frameObj.updateMatrixWorld(true);

          const box = new THREE.Box3().setFromObject(frameObj);

          // 初期5個生成
          for (let i = 0; i < 5; i++) {
            this.spawnHeart(box, sceneEl);
          }

          // 定期生成
          setInterval(() => {
            this.spawnHeart(box, sceneEl);
          }, 1000);
        });
      },

      spawnHeart: function (box, sceneEl) {
        const x = THREE.MathUtils.lerp(box.min.x + 0.05, box.max.x - 0.05, Math.random());
        const y = THREE.MathUtils.lerp(box.min.y + 0.05, box.max.y - 0.05, Math.random());
        const z = box.max.z - 0.02; // 前面から出す

        const heart = document.createElement('a-entity');
        heart.setAttribute('gltf-model', '#heartModel');
        heart.setAttribute('position', `${x} ${y} ${z}`);
        heart.setAttribute('scale', '0.15 0.15 0.15');
        heart.setAttribute('floating-heart', '');

        // 💖 ツヤ用ライト（heartに追従）
        const glossLight = document.createElement('a-light');
        glossLight.setAttribute('type', 'point');
        glossLight.setAttribute('intensity', '0.35');
        glossLight.setAttribute('distance', '0.6');
        glossLight.setAttribute('decay', '2');
        glossLight.setAttribute('position', '0 0.05 0.1');
        heart.appendChild(glossLight);

        sceneEl.appendChild(heart);
      }
    });

    /* ===============================
       heart浮遊アニメーション
    =============================== */
    AFRAME.registerComponent('floating-heart', {
      tick: function (time, delta) {
        const obj = this.el.object3D;
        obj.position.y += delta * 0.00025;
        obj.rotation.y += delta * 0.0004;
      }
    });
  </script>
</head>

<body style="margin:0; overflow:hidden;">

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  arjs="
    sourceType: webcam;
    debugUIEnabled: false;
  "
  renderer="
    colorManagement: true;
    physicallyCorrectLights: false;
    exposure: 1.6;
  "
>

  <!-- Assets -->
  <a-assets>
    <a-asset-item id="frameModel" src="frame.glb"></a-asset-item>
    <a-asset-item id="heartModel" src="heart.glb"></a-asset-item>
  </a-assets>

  <!-- Hiro Marker -->
  <a-marker preset="hiro">

    <!-- 環境光（-20%） -->
    <a-light type="ambient" intensity="1.44"></a-light>

    <!-- 正面ライト（-20%） -->
    <a-light type="directional" position="0 1 1" intensity="0.96"></a-light>

    <!-- フレーム -->
    <a-entity
      id="frame"
      gltf-model="#frameModel"
      position="0 0 -0.5"
      scale="3.2 3.2 3.2"
      frame-heart-emitter>
    </a-entity>

  </a-marker>

  <!-- Camera -->
  <a-entity camera></a-entity>

</a-scene>

</body>
</html>
