<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Valentine AR Frame</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

  <script>
    // 💖 frame内ランダム位置からheart生成
    AFRAME.registerComponent('heart-emitter', {
      init: function () {
        this.spawn();
        setInterval(() => this.spawn(), 800);
      },
      spawn: function () {
        const heart = document.createElement('a-entity');

        // frameローカル基準（額縁の中）
        const x = (Math.random() - 0.5) * 0.6;
        const y = Math.random() * 0.4 + 0.2;
        const z = 0.05; // frameより手前

        heart.setAttribute('position', `${x} ${y} ${z}`);
        heart.setAttribute('scale', '0.15 0.15 0.15');

        // ❤️ heartモデル
        heart.setAttribute('gltf-model', 'url(heart.glb)');

        // ✨ 強制ツヤマテリアル
        heart.setAttribute('material', {
          metalness: 0.85,
          roughness: 0.15,
          color: '#ff4f8b'
        });

        // ✨ キラッと回転＆上昇
        heart.setAttribute('animation__float', {
          property: 'position',
          to: `${x} ${y + 0.6} ${z}`,
          dur: 3000,
          easing: 'easeOutQuad'
        });

        heart.setAttribute('animation__spin', {
          property: 'rotation',
          to: '0 360 0',
          dur: 2000,
          loop: true
        });

        this.el.appendChild(heart);

        // 消去
        setTimeout(() => {
          heart.parentNode && heart.parentNode.removeChild(heart);
        }, 3500);
      }
    });
  </script>
</head>

<body style="margin:0; overflow:hidden;">

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  arjs="sourceType: webcam; debugUIEnabled: false;"
  renderer="colorManagement: true; exposure: 1.6;"
>

  <a-marker preset="hiro">

    <!-- 🌞 環境光（20%減） -->
    <a-light type="ambient" intensity="1.4"></a-light>

    <!-- 🌞 正面ライト（20%減） -->
    <a-light
      type="directional"
      position="0 1 1"
      intensity="1.0">
    </a-light>

    <!-- ✨ ツヤ用ポイントライト -->
    <a-light
      type="point"
      position="0 0.5 0.5"
      intensity="2.2"
      color="#ffffff">
    </a-light>

    <!-- 🖼 額縁 -->
    <a-entity
      id="frame"
      gltf-model="url(frame.glb)"
      position="0 0 -0.5"
      scale="3.2 3.2 3.2"
      heart-emitter>
    </a-entity>

  </a-marker>

  <a-entity camera></a-entity>

</a-scene>

</body>
</html>
