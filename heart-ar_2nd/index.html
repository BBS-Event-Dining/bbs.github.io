<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Valentine AR Frame</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

  <script>
    // 💖 frame内からheartを出す
    AFRAME.registerComponent('heart-emitter', {
      init: function () {
        this.spawn();
        setInterval(() => this.spawn(), 900);
      },
      spawn: function () {
        const heart = document.createElement('a-entity');

        const x = (Math.random() - 0.5) * 0.6;
        const y = Math.random() * 0.4 + 0.2;
        const z = 0.05;

        heart.setAttribute('position', `${x} ${y} ${z}`);
        heart.setAttribute('scale', '0.15 0.15 0.15');
        heart.setAttribute('gltf-model', 'url(heart.glb?v=1)');

        // ✨ ツヤ強制
        heart.setAttribute('material', {
          metalness: 0.85,
          roughness: 0.15,
          color: '#ff4f8b'
        });

        heart.setAttribute('animation__float', {
          property: 'position',
          to: `${x} ${y + 0.6} ${z}`,
          dur: 3000,
          easing: 'easeOutQuad'
        });

        heart.setAttribute('animation__spin', {
          property: 'rotation',
          to: '0 360 0',
          dur: 2000,
          loop: true
        });

        this.el.appendChild(heart);

        setTimeout(() => {
          heart.parentNode && heart.parentNode.removeChild(heart);
        }, 3500);
      }
    });
  </script>

  <style>
    #shot {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      padding: 14px 24px;
      font-size: 16px;
      border-radius: 30px;
      border: none;
      background: #ff4f8b;
      color: #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
  </style>
</head>

<body style="margin:0; overflow:hidden;">

<!-- 📸 撮影ボタン -->
<button id="shot">📸 撮影</button>

<a-scene
  embedded
  vr-mode-ui="enabled:false"
  arjs="sourceType: webcam; debugUIEnabled: false;"
  renderer="colorManagement: true; antialias: true; exposure: 1.6;"
>

  <a-marker preset="hiro">

    <!-- 🌞 ライト（20%減） -->
    <a-light type="ambient" intensity="1.4"></a-light>

    <a-light
      type="directional"
      position="0 1 1"
      intensity="1.0">
    </a-light>

    <!-- ✨ ツヤ用 -->
    <a-light
      type="point"
      position="0 0.5 0.5"
      intensity="2.2">
    </a-light>

    <!-- 🖼 frame -->
    <a-entity
      id="frame"
      gltf-model="url(frame.glb?v=1)"
      position="0 0 -0.5"
      scale="3.2 3.2 3.2"
      heart-emitter>
    </a-entity>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<!-- 📸 スクリーンショット処理 -->
<script>
document.getElementById('shot').addEventListener('click', () => {
  const scene = document.querySelector('a-scene');
  const canvas = scene.renderer.domElement;

  const image = canvas.toDataURL('image/png');

  const a = document.createElement('a');
  a.href = image;
  a.download = 'valentine-ar.png';
  a.click();
});
</script>

</body>
</html>
