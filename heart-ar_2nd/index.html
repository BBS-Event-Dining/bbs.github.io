<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Valentine Marker AR</title>

<script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

<style>
body {
  margin:0;
  overflow:hidden;
  background:#000;
}

/* Safari対策：UIは最上位 */
#ui {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
}

#shoot {
  position: absolute;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  padding: 14px 28px;
  border-radius: 30px;
  border: none;
  font-size: 16px;
  background: #ff4d6d;
  color: #fff;
  pointer-events: auto;
}
</style>
</head>

<body>

<!-- UI Layer -->
<div id="ui">
  <button id="shoot">📸 撮影</button>
</div>

<canvas id="capture" style="display:none;"></canvas>

<a-scene
  embedded
  vr-mode-ui="enabled:false"
  arjs="sourceType:webcam; debugUIEnabled:false;"
  renderer="colorManagement:true; physicallyCorrectLights:true; exposure:1.4;"
  style="pointer-events:none;"
>

  <a-light type="ambient" intensity="1.6"></a-light>
  <a-light type="directional" position="0 3 2" intensity="2.2"></a-light>

  <a-marker preset="hiro">
    <a-entity
      id="frame"
      gltf-model="url(frame.glb)"
      scale="1.7 1.7 1.7">
    </a-entity>

    <a-entity id="heartContainer"></a-entity>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
/* ===== Heart spawn ===== */
const heartContainer = document.getElementById("heartContainer");

setInterval(() => {
  const h = document.createElement("a-entity");
  h.setAttribute("gltf-model", "url(heart.glb)");
  const x = (Math.random()-0.5)*0.8;
  h.setAttribute("position", `${x} 0 0`);
  h.setAttribute("scale", "0.25 0.25 0.25");

  h.addEventListener("model-loaded", e => {
    e.detail.model.traverse(o => {
      if (o.isMesh) {
        o.material.metalness = 0.85;
        o.material.roughness = 0.12;
        o.material.envMapIntensity = 1.8;
        o.material.needsUpdate = true;
      }
    });
  });

  h.setAttribute("animation", {
    property:"position",
    to:`${x} 1.2 0`,
    dur:2600
  });

  heartContainer.appendChild(h);
  setTimeout(()=>h.remove(),2700);
},700);

/* ===== Capture ===== */
const shoot = document.getElementById("shoot");
const canvas = document.getElementById("capture");
const ctx = canvas.getContext("2d");

shoot.onclick = () => {
  const video = document.querySelector("video");
  if (!video || video.videoWidth === 0) {
    alert("カメラ準備中");
    return;
  }

  const w = video.videoWidth;
  const h = video.videoHeight;

  canvas.width = w;
  canvas.height = h;

  ctx.drawImage(video, 0, 0, w, h);
  ctx.drawImage(
    document.querySelector("a-scene").renderer.domElement,
    0, 0, w, h
  );

  const a = document.createElement("a");
  a.href = canvas.toDataURL("image/png");
  a.download = "valentine_ar.png";
  a.click();
};
</script>

</body>
</html>
