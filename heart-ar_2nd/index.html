<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Valentine AR</title>

<script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

<style>
html,body{margin:0;overflow:hidden;background:black;}

#shootBtn{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  z-index:9999;
  padding:16px 32px;
  font-size:16px;
  border-radius:30px;
  border:none;
}

#guide{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:rgba(0,0,0,.6);
  color:white;
  font-size:18px;
  z-index:10000;
}
</style>
</head>

<body>

<button id="shootBtn">📸 撮影</button>

<div id="guide">
この状態で<br>
📱 端末のスクリーンショットを撮ってください
</div>

<a-scene
  embedded
  vr-mode-ui="enabled:false"
  arjs="sourceType:webcam; debugUIEnabled:false;"
>

<a-marker preset="hiro">

  <a-light type="ambient" intensity="1.4"></a-light>
  <a-light type="directional" position="1 2 1" intensity="1.0"></a-light>

  <a-entity
    gltf-model="url(frame.glb)"
    position="0 0 -0.6"
    scale="2.4 2.4 2.4">
  </a-entity>

  <a-entity
    gltf-model="url(heart.glb)"
    position="0 0 0"
    scale="0.35 0.35 0.35"
    animation="property:rotation; to:0 360 0; loop:true; dur:5000">
  </a-entity>

</a-marker>

<a-entity camera></a-entity>
</a-scene>

<script>
const btn=document.getElementById("shootBtn");
const guide=document.getElementById("guide");

btn.addEventListener("click",showGuide);
btn.addEventListener("touchstart",showGuide);

function showGuide(){
  guide.style.display="flex";
  setTimeout(()=>guide.style.display="none",3000);
}
</script>

</body>
</html>
