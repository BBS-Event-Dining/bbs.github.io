<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Valentine Floor AR</title>

<script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

<style>
body { margin:0; overflow:hidden; background:#000; }
#shoot {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  padding: 14px 28px;
  border-radius: 30px;
  border: none;
  font-size: 16px;
  background: #ff4d6d;
  color: #fff;
}
</style>
</head>

<body>

<button id="shoot">📸 撮影</button>
<canvas id="capture" style="display:none;"></canvas>

<a-scene
  embedded
  vr-mode-ui="enabled:false"
  arjs="sourceType:webcam; debugUIEnabled:false;"
  renderer="colorManagement:true; exposure:1.3;"
>

  <!-- Lights -->
  <a-light type="ambient" intensity="1.4"></a-light>
  <a-light type="directional" position="0 2 1" intensity="1.0"></a-light>

  <!-- Frame -->
  <a-entity
    id="frame"
    gltf-model="url(frame.glb)"
    scale="1.6 1.6 1.6"
    visible="false">
  </a-entity>

  <!-- Hearts -->
  <a-entity id="heartContainer"></a-entity>

  <a-entity camera></a-entity>
</a-scene>

<script>
/* ========= floor placement ========= */
let placed = false;

window.addEventListener("click", () => {
  if (placed) return;

  document.getElementById("frame")
    .setAttribute("position", "0 -0.5 -2");

  document.getElementById("frame")
    .setAttribute("visible", "true");

  placed = true;
});

/* ========= heart spawn ========= */
const heartContainer = document.getElementById("heartContainer");

setInterval(() => {
  if (!placed) return;

  const h = document.createElement("a-entity");
  h.setAttribute("gltf-model", "url(heart.glb)");

  const x = (Math.random() - 0.5) * 0.8;
  h.setAttribute("position", `${x} 0 -2`);
  h.setAttribute("scale", "0.25 0.25 0.25");

  h.addEventListener("model-loaded", e => {
    e.detail.model.traverse(o => {
      if (o.isMesh) {
        o.material.metalness = 0.7;
        o.material.roughness = 0.15;
      }
    });
  });

  h.setAttribute("animation", {
    property: "position",
    to: `${x} 1.2 -2`,
    dur: 2500
  });

  heartContainer.appendChild(h);
  setTimeout(() => h.remove(), 2600);
}, 700);

/* ========= capture ========= */
const canvas = document.getElementById("capture");
const ctx = canvas.getContext("2d");
const video = document.querySelector("video");

let videoReady = false;
video.addEventListener("canplay", () => videoReady = true);

function drawSparkles(ctx,w,h){
  for(let i=0;i<30;i++){
    ctx.beginPath();
    ctx.arc(Math.random()*w, Math.random()*h*0.6, 3, 0, Math.PI*2);
    ctx.fillStyle="rgba(255,200,230,0.7)";
    ctx.shadowColor="rgba(255,180,220,0.9)";
    ctx.shadowBlur=12;
    ctx.fill();
  }
}

document.getElementById("shoot").onclick = () => {
  if (!videoReady) return alert("準備中");

  const w = video.videoWidth;
  const h = video.videoHeight;

  canvas.width = w;
  canvas.height = h;

  ctx.drawImage(video, 0, 0, w, h);

  const arCanvas =
    document.querySelector("a-scene").renderer.domElement;
  ctx.drawImage(arCanvas, 0, 0, w, h);

  drawSparkles(ctx, w, h);

  const a = document.createElement("a");
  a.href = canvas.toDataURL("image/png");
  a.download = "valentine_ar.png";
  a.click();
};
</script>

</body>
</html>
