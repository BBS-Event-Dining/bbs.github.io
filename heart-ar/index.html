<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Chirashi AR</title>

<meta name="viewport"
content="width=device-width, height=device-height,
initial-scale=1.0, user-scalable=no">

<!-- A-Frame -->
<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

<!-- MindAR Image -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
}

/* 撮影ボタン */
#shoot {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  padding: 14px 22px;
  font-size: 16px;
  border-radius: 30px;
  border: none;
  background: #ff4d6d;
  color: #fff;
}
</style>
</head>

<body>

<button id="shoot" disabled>撮影</button>

<a-scene
  embedded
  mindar-image="imageTargetSrc: chirashi.mind; uiScanning: yes;"
  renderer="alpha: true; colorManagement: true;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <!-- チラシ認識 -->
  <a-entity mindar-image-target="targetIndex: 0">
    <a-entity id="heart-container"></a-entity>
  </a-entity>

</a-scene>

<script>
const container = document.querySelector('#heart-container');
const shootBtn = document.getElementById('shoot');
const scene = document.querySelector('a-scene');

let arReady = false;

/* ===== ハート生成 ===== */
function spawnHeart() {
  const heart = document.createElement('a-entity');

  const x0 = (Math.random() - 0.5) * 0.6;
  const y0 = 0;
  const z0 = (Math.random() - 0.5) * 0.6;
  const scale = 0.25;

  heart.setAttribute('gltf-model', 'url(heart2.glb)');
  heart.setAttribute('position', `${x0} ${y0} ${z0}`);
  heart.setAttribute('scale', `${scale} ${scale} ${scale}`);

  heart.setAttribute('animation__move', {
    property: 'position',
    to: `${x0} ${y0 + 0.8} ${z0}`,
    dur: 1400,
    easing: 'easeOutQuad'
  });

  heart.addEventListener('animationcomplete__move', () => {
    heart.remove();
  });

  container.appendChild(heart);
}

/* 定期生成 */
setInterval(spawnHeart, 350);

/* ===== MindAR 準備完了 ===== */
scene.addEventListener('arReady', () => {
  arReady = true;
  shootBtn.disabled = false;
});

/* ===== 撮影処理 ===== */
shootBtn.addEventListener('click', () => {
  if (!arReady) return;

  const video = document.querySelector('video');
  const glCanvas = document.querySelector('canvas');

  if (!video || !glCanvas) {
    alert('カメラが準備できていません');
    return;
  }

  const w = video.videoWidth;
  const h = video.videoHeight;

  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');

  // カメラ映像
  ctx.drawImage(video, 0, 0, w, h);
  // 3D描画
  ctx.drawImage(glCanvas, 0, 0, w, h);

  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = 'chirashi_ar.png';
  a.click();
});
</script>

</body>
</html>
