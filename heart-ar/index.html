<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Chirashi AR - Vertical Coupon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #shoot {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 1000;
      padding: 15px 35px; font-size: 18px; font-weight: bold; border-radius: 50px;
      border: none; background: #ff4d6d; color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    video { position: absolute; top: 0; left: 0; z-index: -2; }
  </style>
</head>

<body>

  <button id="shoot" disabled>読み込み中...</button>

  <a-scene
    embedded
    mindar-image="imageTargetSrc: chirashi.mind; uiScanning: yes;"
    renderer="preserveDrawingBuffer: true; alpha: true; colorManagement: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img id="couponImg" src="coupon.png">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      
      <a-image 
        id="coupon-entity" 
        src="#couponImg" 
        position="0 0.4 0" 
        rotation="0 0 0" 
        scale="1 1 1">
      </a-image>
      
      <a-entity id="heart-container"></a-entity>
    </a-entity>

  </a-scene>

  <script>
    const container = document.querySelector('#heart-container');
    const shootBtn = document.getElementById('shoot');
    const sceneEl = document.querySelector('a-scene');
    let arReady = false;

    /* ハート生成（垂直に立ったクーポンから出す） */
    function spawnHeart() {
      const targetEntity = document.querySelector('[mindar-image-target]');
      if (!targetEntity.object3D.visible) return;

      const heart = document.createElement('a-entity');
      
      // クーポンの根元（地面に近いところ）から発生
      const x = (Math.random() - 0.5) * 0.4;
      const z = (Math.random() - 0.5) * 0.1;

      heart.setAttribute('gltf-model', 'url(heart2.glb)');
      heart.setAttribute('position', `${x} 0.1 ${z}`);
      heart.setAttribute('scale', '0.2 0.2 0.2');
      
      // 垂直に昇っていくアニメーション
      heart.setAttribute('animation', {
        property: 'position',
        to: `${x * 1.2} 1.2 ${z}`, 
        dur: 1500,
        easing: 'easeOutQuad'
      });
      
      heart.addEventListener('animationcomplete', () => heart.remove());
      container.appendChild(heart);
    }
    
    setInterval(spawnHeart, 400);

    sceneEl.addEventListener('arReady', () => {
      arReady = true;
      shootBtn.disabled = false;
      shootBtn.innerText = "撮影する";
    });

    /* 撮影ロジック */
    shootBtn.addEventListener('click', () => {
      if (!arReady) return;
      const video = document.querySelector('video');
      const glCanvas = sceneEl.canvas;
      const screenAspect = window.innerHeight / window.innerWidth;
      const vW = video.videoWidth;
      const vH = video.videoHeight;
      const canvas = document.createElement('canvas');
      canvas.width = vW;
      canvas.height = vW * screenAspect;
      const ctx = canvas.getContext('2d');
      const drawHeight = vW * screenAspect;
      const startY = (vH - drawHeight) / 2;

      ctx.drawImage(video, 0, startY, vW, drawHeight, 0, 0, canvas.width, canvas.height);
      sceneEl.renderer.render(sceneEl.object3D, sceneEl.camera);
      ctx.drawImage(glCanvas, 0, 0, canvas.width, canvas.height);

      const link = document.createElement('a');
      link.download = `AR_Coupon_${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  </script>

</body>
</html>
