<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>Heart AR Fountain Loop</title>
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
    <!-- AR.js -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
  </head>

  <body style="margin:0; overflow:hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: true">

      <!-- オリジナルマーカー -->
      <a-marker type="pattern" url="pattern-marker2.patt">
        <a-entity id="hearts"></a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const container = document.querySelector('#hearts');
      const NUM_HEARTS = 10;         // 一度に飛び出す heart の数
      const SPAWN_INTERVAL = 500;    // ms ごとに heart を追加

      function spawnHeart() {
        const heart = document.createElement('a-entity');
        heart.setAttribute('gltf-model', 'url(heart2.glb)');
        heart.setAttribute('scale', '0.4 0.4 0.4');
        heart.setAttribute('position', '0 0 0');

        // ふんわり噴水状に飛ばす位置をランダム生成
        const angleH = (Math.random() - 0.5) * Math.PI / 2; // 左右 -45°〜+45°
        const angleV = Math.random() * Math.PI / 6;          // 上方向 0°〜30°
        const distance = 1 + Math.random() * 0.5;           // 手前への距離
        const x = distance * Math.sin(angleH);
        const y = distance * Math.sin(angleV);
        const z = -distance * Math.cos(angleV) * Math.cos(angleH);

        heart.setAttribute('animation__move', `
          property: position;
          to: ${x.toFixed(2)} ${y.toFixed(2)} ${z.toFixed(2)};
          dur: 1800;
          easing: easeOutQuad
        `);

        heart.setAttribute('animation__scale', `
          property: scale;
          to: 0.7 0.7 0.7;
          dur: 1800;
          easing: easeOutBack
        `);

        container.appendChild(heart);

        // アニメーション終了後に heart を削除
        setTimeout(() => {
          container.removeChild(heart);
        }, 2000);
      }

      // 一定間隔で heart を追加して連続噴水
      setInterval(() => {
        for (let i = 0; i < NUM_HEARTS; i++) {
          spawnHeart();
        }
      }, SPAWN_INTERVAL);
    </script>
  </body>
</html>
