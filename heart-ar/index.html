<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Heart AR Fountain - Chirashi Marker</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body style="margin:0; overflow:hidden;">
  <a-scene
    embedded
    mindar-image="imageTargetSrc: chirashi.mind; autoStart: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <!-- マーカーに追従するアンカー -->
    <a-entity mindar-image-target="targetIndex: 0">

      <a-entity id="heart-container"></a-entity>

    </a-entity>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  </a-scene>

  <script>
    const container = document.querySelector('#heart-container');

    function spawnHeart() {
      const heart = document.createElement('a-entity');

      const x0 = (Math.random() - 0.5) * 0.6;
      const y0 = Math.random() * 0.2;
      const z0 = (Math.random() - 0.5) * 0.6;

      const scaleVal = 0.2 + Math.random() * 0.1;

      heart.setAttribute('gltf-model', 'url(heart2.glb)');
      heart.setAttribute('position', `${x0} ${y0} ${z0}`);
      heart.setAttribute('scale', `${scaleVal} ${scaleVal} ${scaleVal}`);

      const x1 = x0 + (Math.random() - 0.5) * 0.8;
      const y1 = y0 + 0.6 + Math.random() * 0.6;
      const z1 = z0 + (Math.random() - 0.5) * 0.8;

      heart.setAttribute('animation__move', `
        property: position;
        to: ${x1} ${y1} ${z1};
        dur: ${1200 + Math.random() * 800};
        easing: easeOutQuad
      `);

      heart.setAttribute('animation__scale', `
        property: scale;
        to: ${scaleVal*1.5} ${scaleVal*1.5} ${scaleVal*1.5};
        dur: ${600 + Math.random()*400};
        easing: easeOutBack
      `);

      heart.addEventListener('animationcomplete__move', () => {
        heart.remove();
      });

      container.appendChild(heart);
    }

    function spawnLoop() {
      spawnHeart();
      setTimeout(spawnLoop, 200 + Math.random() * 200);
    }

    // MindAR 起動後に生成開始
    document.addEventListener("DOMContentLoaded", () => {
      spawnLoop();
    });
  </script>
</body>
</html>
