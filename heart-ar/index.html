<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Chirashi AR - Heart Top</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #shoot {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 1000;
      padding: 15px 35px; font-size: 18px; font-weight: bold; border-radius: 50px;
      border: none; background: #ff4d6d; color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    video { position: absolute; top: 0; left: 0; z-index: -2; }

    #preview-container {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); z-index: 10000; flex-direction: column; align-items: center; justify-content: center;
    }
    #preview-image { max-width: 80%; max-height: 70%; border: 3px solid white; }
    #preview-text { color: white; margin-top: 15px; font-weight: bold; text-align: center; }
    #close-btn { margin-top: 20px; padding: 10px 20px; background: white; border-radius: 5px; border: none; }
  </style>
</head>

<body>

  <button id="shoot" disabled>読み込み中...</button>

  <div id="preview-container">
    <img id="preview-image" src="">
    <div id="preview-text">画像を長押しして保存してください</div>
    <button id="close-btn">閉じる</button>
  </div>

  <a-scene
    embedded
    mindar-image="imageTargetSrc: room_targets.mind; uiScanning: yes;"
    renderer="preserveDrawingBuffer: true; alpha: true; colorManagement: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-entity id="heart-container"></a-entity>
    </a-entity>

  </a-scene>

  <script>
    const container = document.querySelector('#heart-container');
    const shootBtn = document.getElementById('shoot');
    const sceneEl = document.querySelector('a-scene');
    const previewContainer = document.getElementById('preview-container');
    const previewImage = document.getElementById('preview-image');
    const closeBtn = document.getElementById('close-btn');

    let arReady = false;

    function spawnHeart() {
      const targetEntity = document.querySelector('[mindar-image-target]');
      if (!targetEntity || !targetEntity.object3D.visible) return;

      const heart = document.createElement('a-entity');
      
      // 横幅(x)はそのまま
      const x = (Math.random() - 0.5) * 0.6;
      
      // 高さ(y)を「0.3（中央やや上）から 0.6（上端付近）」の範囲に設定
      const y = (Math.random() * 0.3) + 0.3; 

      heart.setAttribute('gltf-model', 'url(heart2.glb)');
      heart.setAttribute('rotation', '90 0 0');
      heart.setAttribute('position', `${x} ${y} 0.1`);
      heart.setAttribute('scale', '0.2 0.2 0.2');
      
      heart.setAttribute('animation', {
        property: 'position',
        to: `${x} ${y + 0.5} 2.5`, // 少し上昇しながら手前に飛ぶように変更
        dur: 1500,
        easing: 'easeOutQuad'
      });
      
      heart.addEventListener('animationcomplete', () => heart.remove());
      container.appendChild(heart);
    }
    
    setInterval(spawnHeart, 400);

    sceneEl.addEventListener('arReady', () => {
      arReady = true;
      shootBtn.disabled = false;
      shootBtn.innerText = "撮影する";
    });

    shootBtn.addEventListener('click', () => {
      if (!arReady) return;
      const video = document.querySelector('video');
      const glCanvas = sceneEl.canvas;
      const screenAspect = window.innerHeight / window.innerWidth;
      const vW = video.videoWidth;
      const vH = video.videoHeight;
      const canvas = document.createElement('canvas');
      canvas.width = vW;
      canvas.height = vW * screenAspect;
      const ctx = canvas.getContext('2d');
      const drawHeight = vW * screenAspect;
      const startY = (vH - drawHeight) / 2;

      ctx.drawImage(video, 0, startY, vW, drawHeight, 0, 0, canvas.width, canvas.height);
      sceneEl.renderer.render(sceneEl.object3D, sceneEl.camera);
      ctx.drawImage(glCanvas, 0, 0, canvas.width, canvas.height);

      const dataUrl = canvas.toDataURL('image/png');
      previewImage.src = dataUrl;
      previewContainer.style.display = 'flex';
    });

    closeBtn.addEventListener('click', () => {
      previewContainer.style.display = 'none';
    });
  </script>

</body>
</html>
