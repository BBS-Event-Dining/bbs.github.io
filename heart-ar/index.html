<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>AR Heart Bounce</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #shoot {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 1000;
      padding: 15px 35px; font-size: 18px; font-weight: bold; border-radius: 50px;
      border: none; background: #ff4d6d; color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    video { position: absolute; top: 0; left: 0; z-index: -2; }
    #preview-container {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); z-index: 10000; flex-direction: column; align-items: center; justify-content: center;
    }
    #preview-image { max-width: 80%; max-height: 85%; border: 3px solid white; object-fit: contain; }
    #preview-text { color: white; margin-top: 10px; font-weight: bold; text-align: center; }
    #close-btn { margin-top: 15px; padding: 10px 20px; background: white; border-radius: 5px; border: none; }
  </style>
</head>

<body>

  <button id="shoot" disabled>読み込み中...</button>

  <div id="preview-container">
    <img id="preview-image" src="">
    <div id="preview-text">画像を長押しして保存してください</div>
    <button id="close-btn">閉じる</button>
  </div>

  <a-scene
    embedded
    mindar-image="imageTargetSrc: room_targets.mind; uiScanning: yes;"
    renderer="preserveDrawingBuffer: true; alpha: true; colorManagement: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-entity id="heart-container"></a-entity>
    </a-entity>

  </a-scene>

  <script>
    const container = document.querySelector('#heart-container');
    const shootBtn = document.getElementById('shoot');
    const sceneEl = document.querySelector('a-scene');
    const previewContainer = document.getElementById('preview-container');
    const previewImage = document.getElementById('preview-image');
    const closeBtn = document.getElementById('close-btn');

    let arReady = false;

    /* 跳ね返りアニメーション付きハート生成 */
    function spawnHeart() {
      const targetEntity = document.querySelector('[mindar-image-target]');
      if (!targetEntity || !targetEntity.object3D.visible) return;

      const heart = document.createElement('a-entity');
      const startX = (Math.random() - 0.5) * 1.0; 
      const startY = 0.5; // 上辺から
      const startZ = 0.1;

      heart.setAttribute('gltf-model', 'url(heart2.glb)');
      heart.setAttribute('rotation', '90 0 0');
      heart.setAttribute('position', `${startX} ${startY} ${startZ}`);
      heart.setAttribute('scale', '0.12 0.12 0.12');
      
      container.appendChild(heart);

      // 物理パラメーター
      let pos = { x: startX, y: startY, z: 0.9 }; // z=0.9(90cm前)に固定
      let velY = 0;           // 垂直速度
      const gravity = -0.0015; // 重力
      const bounce = -0.6;    // 跳ね返り係数（反発）
      const floorY = -0.5;    // 跳ね返る床の高さ（マーカーの下辺あたり）

      // 最初に90cm前に出すアニメーション
      heart.setAttribute('animation', {
        property: 'position',
        to: `${startX} ${startY} 0.9`,
        dur: 600,
        easing: 'easeOutQuad'
      });

      // 飛び出した後に自由落下と跳ね返りを開始
      setTimeout(() => {
        const update = () => {
          velY += gravity;
          pos.y += velY;

          // 床に衝突
          if (pos.y <= floorY) {
            pos.y = floorY;
            velY *= bounce;
            // 勢いがなくなったら停止
            if (Math.abs(velY) < 0.005) {
              setTimeout(() => {
                if(heart.parentNode) heart.remove();
              }, 1000);
              return; 
            }
          }

          heart.setAttribute('position', `${pos.x} ${pos.y} ${pos.z}`);
          requestAnimationFrame(update);
        };
        update();
      }, 600);
    }
    
    setInterval(spawnHeart, 300);

    sceneEl.addEventListener('arReady', () => {
      arReady = true;
      shootBtn.disabled = false;
      shootBtn.innerText = "撮影する";
    });

    shootBtn.addEventListener('click', () => {
      if (!arReady) return;
      const video = document.querySelector('video');
      const glCanvas = sceneEl.canvas;
      const canvas = document.createElement('canvas');
      canvas.width = window.innerWidth * window.devicePixelRatio;
      canvas.height = window.innerHeight * window.devicePixelRatio;
      const ctx = canvas.getContext('2d');

      const vW = video.videoWidth;
      const vH = video.videoHeight;
      const videoAspect = vW / vH;
      const canvasAspect = canvas.width / canvas.height;
      
      let sx, sy, sw, sh;
      if (videoAspect > canvasAspect) {
        sw = vH * canvasAspect; sh = vH; sx = (vW - sw) / 2; sy = 0;
      } else {
        sw = vW; sh = vW / canvasAspect; sx = 0; sy = (vH - sh) / 2;
      }
      ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
      sceneEl.renderer.render(sceneEl.object3D, sceneEl.camera);
      ctx.drawImage(glCanvas, 0, 0, canvas.width, canvas.height);

      previewImage.src = canvas.toDataURL('image/png');
      previewContainer.style.display = 'flex';
    });

    closeBtn.addEventListener('click', () => {
      previewContainer.style.display = 'none';
    });
  </script>
</body>
</html>
