<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Chirashi AR</title>

<meta name="viewport"
content="width=device-width, height=device-height,
initial-scale=1.0, user-scalable=no">

<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
}
#shoot {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  padding: 14px 24px;
  font-size: 16px;
  border-radius: 30px;
  border: none;
  background: #ff4d6d;
  color: #fff;
}
</style>
</head>

<body>

<button id="shoot" disabled>撮影</button>

<a-scene
  embedded
  mindar-image="imageTargetSrc: chirashi.mind; uiScanning: yes;"
  renderer="alpha: true; preserveDrawingBuffer: true;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity mindar-image-target="targetIndex: 0">
    <a-entity id="heart-container"></a-entity>
  </a-entity>

</a-scene>

<script>
const container = document.querySelector('#heart-container');
const shootBtn = document.getElementById('shoot');
const sceneEl = document.querySelector('a-scene');
let arReady = false;

/* ハート生成 */
function spawnHeart() {
  const heart = document.createElement('a-entity');
  const x = (Math.random() - 0.5) * 0.6;
  const z = (Math.random() - 0.5) * 0.6;
  const s = 0.25;

  heart.setAttribute('gltf-model', 'url(heart2.glb)');
  heart.setAttribute('position', `${x} 0 ${z}`);
  heart.setAttribute('scale', `${s} ${s} ${s}`);
  heart.setAttribute('animation', {
    property: 'position',
    to: `${x} 0.8 ${z}`,
    dur: 1400,
    easing: 'easeOutQuad'
  });
  heart.addEventListener('animationcomplete', () => heart.remove());
  container.appendChild(heart);
}
setInterval(spawnHeart, 350);

/* MindAR ready */
sceneEl.addEventListener('arReady', () => {
  arReady = true;
  shootBtn.disabled = false;
});

/* 撮影 */
shootBtn.addEventListener('click', () => {
  if (!arReady) return;

  const video = document.querySelector('video');
  const glCanvas = sceneEl.canvas;
  const w = video.videoWidth;
  const h = video.videoHeight;

  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');

  ctx.drawImage(video, 0, 0, w, h);

  requestAnimationFrame(() => {
    ctx.drawImage(glCanvas, 0, 0, w, h);
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = 'chirashi_ar.png';
    a.click();
  });
});
</script>

</body>
</html>
