<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Chirashi AR - Capture Fixed</title>

  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #shoot {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      padding: 14px 28px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      border: none;
      background: #ff4d6d;
      color: #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      cursor: pointer;
    }
    #shoot:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <button id="shoot" disabled>撮影する</button>

  <a-scene
    embedded
    mindar-image="imageTargetSrc: chirashi.mind; uiScanning: yes;"
    /* 修正ポイント: preserveDrawingBufferを確実に有効化 */
    renderer="alpha: true; preserveDrawingBuffer: true; colorManagement: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-entity id="heart-container"></a-entity>
    </a-entity>

  </a-scene>

  <script>
    const container = document.querySelector('#heart-container');
    const shootBtn = document.getElementById('shoot');
    const sceneEl = document.querySelector('a-scene');
    let arReady = false;

    /* ハート生成 (既存ロジック) */
    function spawnHeart() {
      // ターゲットが見つかっていない時は生成しない（メモリ節約のため任意で追加）
      // if (!container.object3D.visible) return; 

      const heart = document.createElement('a-entity');
      const x = (Math.random() - 0.5) * 0.6;
      const z = (Math.random() - 0.5) * 0.6;
      const s = 0.25;

      heart.setAttribute('gltf-model', 'url(heart2.glb)');
      heart.setAttribute('position', `${x} 0 ${z}`);
      heart.setAttribute('scale', `${s} ${s} ${s}`);
      heart.setAttribute('animation', {
        property: 'position',
        to: `${x} 0.8 ${z}`,
        dur: 1400,
        easing: 'easeOutQuad'
      });
      heart.addEventListener('animationcomplete', () => heart.remove());
      container.appendChild(heart);
    }
    setInterval(spawnHeart, 350);

    /* MindAR 準備完了イベント */
    sceneEl.addEventListener('arReady', () => {
      arReady = true;
      shootBtn.disabled = false;
    });

    /* 撮影処理の修正版 */
    shootBtn.addEventListener('click', () => {
      if (!arReady) return;

      const video = document.querySelector('video');
      const glCanvas = sceneEl.canvas;
      
      // ビデオの解像度を取得
      const w = video.videoWidth;
      const h = video.videoHeight;

      // 保存用の一時キャンバスを作成
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');

      // 1. 背景のカメラ映像を描画
      ctx.drawImage(video, 0, 0, w, h);

      // 2. ARオブジェクトを強制的にレンダリング
      // これによりWebGLバッファが最新状態に更新される
      sceneEl.renderer.render(sceneEl.object3D, sceneEl.camera);

      // 3. ARのキャンバス(WebGL)をビデオの上に重ねる
      // 画面上の見た目ではなく、ビデオの解像度に合わせて描画
      ctx.drawImage(glCanvas, 0, 0, w, h);

      // 4. 画像としてダウンロード
      try {
        const link = document.createElement('a');
        link.download = `ar_photo_${Date.now()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      } catch (e) {
        console.error("Save error:", e);
        alert("画像の保存に失敗しました。");
      }
    });
  </script>

</body>
</html>
