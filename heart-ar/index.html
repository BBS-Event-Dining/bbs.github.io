<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>Heart AR Fountain</title>
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
    <!-- AR.js -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false">

      <!-- Hiroマーカー -->
      <a-marker preset="hiro">
        
        <!-- heartを複数生成 -->
        <a-entity id="heart-container"></a-entity>

        <script>
          const container = document.querySelector('#heart-container');
          const numHearts = 8; // 飛び出すheartの数

          for (let i = 0; i < numHearts; i++) {
            const heart = document.createElement('a-entity');
            // ランダムな初期位置
            const x = (Math.random() - 0.5) * 0.2;
            const y = 0;
            const z = (Math.random() - 0.5) * 0.2;

            heart.setAttribute('gltf-model', 'url(heart2.glb)');
            heart.setAttribute('scale', `${0.1 + Math.random()*0.1} ${0.1 + Math.random()*0.1} ${0.1 + Math.random()*0.1}`);
            heart.setAttribute('position', `${x} ${y} ${z}`);

            // スケールアニメーション
            heart.setAttribute('animation__scale', `
              property: scale; 
              to: ${0.2 + Math.random()*0.2} ${0.2 + Math.random()*0.2} ${0.2 + Math.random()*0.2}; 
              dur: ${800 + Math.random()*400}; 
              easing: easeOutBack
            `);

            // 位置アニメーション
            heart.setAttribute('animation__move', `
              property: position; 
              to: ${x} ${0.5 + Math.random()*0.3} ${z + 0.2 + Math.random()*0.2}; 
              dur: ${1200 + Math.random()*400}; 
              easing: easeOutQuad
            `);

            container.appendChild(heart);
          }
        </script>

      </a-marker>

      <!-- カメラ -->
      <a-entity camera></a-entity>

    </a-scene>
  </body>
</html>
