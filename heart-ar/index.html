<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Heart AR Sample</title>
    <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
    <script src="https://cdn.rawgit.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false">

      <!-- デフォルト Hiro マーカー -->
      <a-marker preset="hiro">

        <!-- heart -->
        <a-entity
  gltf-model="url(heart2.glb)"
  scale="0.2 0.2 0.2"
  position="0 0 0"
  rotation="0 0 0"
  animation__scale="property: scale; to: 0.4 0.4 0.4; dur: 600; easing: easeOutBack"
  animation__move="property: position; to: 0 0.3 0.2; dur: 1200; easing: easeOutQuad">
</a-entity>


      </a-marker>

      <!-- カメラ -->
      <a-entity camera></a-entity>

    </a-scene>
  </body>
</html>
