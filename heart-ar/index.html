<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Chirashi AR - Final Version</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>

  <style>
    /* 画面表示の修正：背景を透明にしてカメラを見えるようにする */
    html, body { 
      margin: 0; 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background: transparent; 
    }

    /* 撮影ボタンのスタイル */
    #shoot {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      padding: 15px 35px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 50px;
      border: none;
      background: #ff4d6d;
      color: #fff;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #shoot:active {
      background: #e63958;
      transform: translateX(-50%) scale(0.95);
    }
    #shoot:disabled {
      background: #ccc;
    }

    /* ビデオ要素の背面配置設定 */
    video {
      position: absolute;
      top: 0;
      left: 0;
      z-index: -2;
    }
  </style>
</head>

<body>

  <button id="shoot" disabled>読み込み中...</button>

  <a-scene
    embedded
    mindar-image="imageTargetSrc: chirashi.mind; uiScanning: yes;"
    renderer="preserveDrawingBuffer: true; alpha: true; colorManagement: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-entity id="heart-container"></a-entity>
    </a-entity>

  </a-scene>

  <script>
    const container = document.querySelector('#heart-container');
    const shootBtn = document.getElementById('shoot');
    const sceneEl = document.querySelector('a-scene');
    let arReady = false;

    /* 1. ハート生成ロジック */
    function spawnHeart() {
      // マーカーが見えていない時は生成しない（負荷軽減）
      if (!container.object3D.visible) return;

      const heart = document.createElement('a-entity');
      const x = (Math.random() - 0.5) * 0.7;
      const z = (Math.random() - 0.5) * 0.7;
      const s = 0.25;

      heart.setAttribute('gltf-model', 'url(heart2.glb)');
      heart.setAttribute('position', `${x} 0 ${z}`);
      heart.setAttribute('scale', `${s} ${s} ${s}`);
      heart.setAttribute('animation', {
        property: 'position',
        to: `${x} 1.2 ${z}`,
        dur: 1500,
        easing: 'easeOutQuad'
      });
      
      // アニメーション終了後に削除
      heart.addEventListener('animationcomplete', () => heart.remove());
      container.appendChild(heart);
    }
    setInterval(spawnHeart, 400);

    /* 2. 準備完了イベント */
    sceneEl.addEventListener('arReady', () => {
      arReady = true;
      shootBtn.disabled = false;
      shootBtn.innerText = "撮影する";
    });

    /* 3. フル画面撮影＆保存（Android/iPhone対応） */
    shootBtn.addEventListener('click', () => {
      if (!arReady) return;

      const video = document.querySelector('video');
      const glCanvas = sceneEl.canvas;
      
      // スマホ画面の比率（縦長度合い）
      const screenAspect = window.innerHeight / window.innerWidth;

      // ビデオの解像度
      const vW = video.videoWidth;
      const vH = video.videoHeight;

      // 保存用キャンバス（画面比率に合わせて計算）
      const canvas = document.createElement('canvas');
      canvas.width = vW;
      canvas.height = vW * screenAspect;
      const ctx = canvas.getContext('2d');

      // ビデオの中央をスマホ画角で切り抜く計算
      const drawHeight = vW * screenAspect;
      const startY = (vH - drawHeight) / 2;

      // A. 背景ビデオを描画（中央クロップ）
      ctx.drawImage(video, 0, startY, vW, drawHeight, 0, 0, canvas.width, canvas.height);

      // B. ARオブジェクトを強制描画
      sceneEl.renderer.render(sceneEl.object3D, sceneEl.camera);

      // C. ARキャンバスを重ねる
      ctx.drawImage(glCanvas, 0, 0, canvas.width, canvas.height);

      // D. 画像保存処理
      try {
        const dataUrl = canvas.toDataURL('image/png');
        const link = document.createElement('a');
        const now = new Date();
        const time = now.getHours() + "" + now.getMinutes() + "" + now.getSeconds();
        
        link.download = `AR_Chirashi_${time}.png`;
        link.href = dataUrl;
        
        // iOS/Android 両対応のためのクリック
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      } catch (err) {
        console.error("保存エラー:", err);
        alert("保存に失敗しました。ブラウザの権限を確認してください。");
      }
    });
  </script>

</body>
</html>
