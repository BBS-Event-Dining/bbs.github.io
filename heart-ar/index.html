<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>AR Heart - Smooth Bounce</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #shoot {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 1000;
      padding: 15px 35px; font-size: 18px; font-weight: bold; border-radius: 50px;
      border: none; background: #ff4d6d; color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    video { position: absolute; top: 0; left: 0; z-index: -2; }
    #preview-container {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); z-index: 20000; flex-direction: column; align-items: center; justify-content: center;
    }
    #preview-image { 
      max-width: 90%; max-height: 80%; border: 3px solid white; 
      display: block; pointer-events: auto !important; -webkit-touch-callout: default !important;
    }
    #preview-text { color: white; margin-top: 15px; font-weight: bold; text-align: center; pointer-events: none; }
    #close-btn { margin-top: 20px; padding: 12px 25px; background: white; border-radius: 5px; border: none; font-weight: bold; }
  </style>
</head>

<body>

  <button id="shoot" disabled>読み込み中...</button>

  <div id="preview-container">
    <img id="preview-image" src="" alt="Captured Image">
    <div id="preview-text">画像を長押しして保存してください</div>
    <button id="close-btn">閉じる</button>
  </div>

  <a-scene
    embedded
    mindar-image="imageTargetSrc: room_targets.mind; uiScanning: yes;"
    renderer="preserveDrawingBuffer: true; alpha: true; colorManagement: true; antialias: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-entity id="heart-container"></a-entity>
    </a-entity>
  </a-scene>

  <script>
    const container = document.querySelector('#heart-container');
    const shootBtn = document.getElementById('shoot');
    const sceneEl = document.querySelector('a-scene');
    const previewContainer = document.getElementById('preview-container');
    const previewImage = document.getElementById('preview-image');
    const closeBtn = document.getElementById('close-btn');

    let arReady = false;
    let currentObjectUrl = null;

    function spawnHeart() {
      const targetEntity = document.querySelector('[mindar-image-target]');
      if (!targetEntity || !targetEntity.object3D.visible) return;

      const heart = document.createElement('a-entity');
      const startX = (Math.random() - 0.5) * 1.0; 
      const startY = 0.5; // 上辺
      const startZ = 0.1; // マーカー付近

      heart.setAttribute('gltf-model', 'url(heart2.glb)');
      heart.setAttribute('rotation', '90 0 0');
      heart.setAttribute('position', `${startX} ${startY} ${startZ}`);
      heart.setAttribute('scale', '0.12 0.12 0.12');
      container.appendChild(heart);

      // 1. まず90cm手前(Z:0.9)へ噴き出す
      heart.setAttribute('animation__forward', {
        property: 'position',
        to: `${startX} ${startY + 0.2} 0.9`,
        dur: 500,
        easing: 'easeOutQuad'
      });

      // 2. 噴き出した後、物理挙動（落下＆バウンド）を開始
      heart.addEventListener('animationcomplete__forward', () => {
        let pos = { x: startX, y: startY + 0.2, z: 0.9 };
        let velY = 0;
        let velZ = 0.015;       // 前方に進む速度（120cmへ向かう）
        const gravity = -0.0015;
        const bounce = -0.6;
        const floorY = -0.5;
        const targetZ = 1.2;    // 120cm手前

        const update = () => {
          velY += gravity;
          pos.y += velY;
          
          // 120cm手前まで徐々に進む
          if (pos.z < targetZ) {
            pos.z += velZ;
          }

          // 床に衝突
          if (pos.y <= floorY) {
            pos.y = floorY;
            velY *= bounce;
            velZ *= 0.8; // バウンド時に前方への勢いも少し殺す

            if (Math.abs(velY) < 0.005) {
              setTimeout(() => { if(heart.parentNode) heart.remove(); }, 1500);
              return; 
            }
          }

          // 直接座標を書き換える（震え防止のため、文字列変換を避けてObject3Dを直接操作）
          heart.object3D.position.set(pos.x, pos.y, pos.z);
          requestAnimationFrame(update);
        };
        update();
      });
    }
    
    setInterval(spawnHeart, 400);

    sceneEl.addEventListener('arReady', () => {
      arReady = true;
      shootBtn.disabled = false;
      shootBtn.innerText = "撮影する";
    });

    shootBtn.addEventListener('click', () => {
      if (!arReady) return;
      const video = document.querySelector('video');
      const glCanvas = sceneEl.canvas;
      const canvas = document.createElement('canvas');
      const dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      const ctx = canvas.getContext('2d');

      const vW = video.videoWidth;
      const vH = video.videoHeight;
      const videoAspect = vW / vH;
      const canvasAspect = canvas.width / canvas.height;
      
      let sx, sy, sw, sh;
      if (videoAspect > canvasAspect) {
        sw = vH * canvasAspect; sh = vH; sx = (vW - sw) / 2; sy = 0;
      } else {
        sw = vW; sh = vW / canvasAspect; sx = 0; sy = (vH - sh) / 2;
      }

      ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
      sceneEl.renderer.render(sceneEl.object3D, sceneEl.camera);
      ctx.drawImage(glCanvas, 0, 0, canvas.width, canvas.height);

      canvas.toBlob((blob) => {
        if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = URL.createObjectURL(blob);
        previewImage.src = currentObjectUrl;
        previewContainer.style.display = 'flex';
      }, 'image/png');
    });

    closeBtn.addEventListener('click', () => {
      previewContainer.style.display = 'none';
      if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
      previewImage.src = "";
    });
  </script>
</body>
</html>
