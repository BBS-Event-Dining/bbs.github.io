<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Chirashi AR - Full Screen Capture</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #shoot {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 9999;
      padding: 14px 28px; font-size: 18px; font-weight: bold; border-radius: 30px;
      border: none; background: #ff4d6d; color: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
  </style>
</head>

<body>
  <button id="shoot" disabled>撮影する</button>

  <a-scene
    embedded
    mindar-image="imageTargetSrc: chirashi.mind; uiScanning: yes; filterMinCF:0.001; filterBeta: 0.01;"
    renderer="alpha: true; preserveDrawingBuffer: true; colorManagement: true; antialias: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity mindar-image-target="targetIndex: 0">
      <a-entity id="heart-container"></a-entity>
    </a-entity>
  </a-scene>

  <script>
    const container = document.querySelector('#heart-container');
    const shootBtn = document.getElementById('shoot');
    const sceneEl = document.querySelector('a-scene');
    let arReady = false;

    /* ハート生成ロジック */
    function spawnHeart() {
      const heart = document.createElement('a-entity');
      const x = (Math.random() - 0.5) * 0.6;
      const z = (Math.random() - 0.5) * 0.6;
      heart.setAttribute('gltf-model', 'url(heart2.glb)');
      heart.setAttribute('position', `${x} 0 ${z}`);
      heart.setAttribute('scale', '0.25 0.25 0.25');
      heart.setAttribute('animation', {
        property: 'position', to: `${x} 0.8 ${z}`, dur: 1400, easing: 'easeOutQuad'
      });
      heart.addEventListener('animationcomplete', () => heart.remove());
      container.appendChild(heart);
    }
    setInterval(spawnHeart, 350);

    sceneEl.addEventListener('arReady', () => {
      arReady = true;
      shootBtn.disabled = false;
    });

    /* 撮影処理：画面の比率に合わせてクロップ保存 */
    shootBtn.addEventListener('click', () => {
      if (!arReady) return;

      const video = document.querySelector('video');
      const glCanvas = sceneEl.canvas;
      
      // 1. スマホ画面の比率（アスペクト比）を計算
      const screenW = window.innerWidth;
      const screenH = window.innerHeight;
      const screenAspect = screenH / screenW;

      // 2. カメラ映像の実際のサイズ
      const videoW = video.videoWidth;
      const videoH = video.videoHeight;
      const videoAspect = videoH / videoW;

      // 3. 保存用キャンバスのサイズ決定（高画質を保つためビデオの横幅を基準にする）
      const canvas = document.createElement('canvas');
      canvas.width = videoW; 
      canvas.height = videoW * screenAspect; // 画面比率に合わせる
      const ctx = canvas.getContext('2d');

      // 4. ビデオの描画範囲を計算（中央を切り抜く：object-fit: cover の再現）
      let sx, sy, sw, sh;
      if (videoAspect > screenAspect) {
        // ビデオの方が縦に長い場合
        sw = videoW;
        sh = videoW * screenAspect;
        sx = 0;
        sy = (videoH - sh) / 2;
      } else {
        // ビデオの方が横に長い場合（基本スマホの縦持ちならこちら）
        sh = videoH;
        sw = videoH / screenAspect;
        sx = (videoW - sw) / 2;
        sy = 0;
      }

      // 背景（カメラ映像）を描画
      ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);

      // 5. ARオブジェクトを強制描画
      sceneEl.renderer.render(sceneEl.object3D, sceneEl.camera);

      // 6. ARキャンバスを重ねる（CSSでの見え方に合わせるため、少し計算が必要な場合があるが、
      // 基本的にMindARが全画面表示に調整してくれているので、そのまま描画して合わせる）
      // 注意：A-FrameのCanvasサイズが画面サイズと同期していることを利用
      ctx.drawImage(glCanvas, 0, 0, canvas.width, canvas.height);

      // 7. 保存
      const link = document.createElement('a');
      link.download = `ar_full_capture_${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
