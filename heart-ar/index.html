<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Chirashi AR</title>

  <meta name="viewport"
    content="width=device-width, height=device-height,
    initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }

    #shoot {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      padding: 14px 20px;
      font-size: 16px;
      border-radius: 30px;
      border: none;
      background: #ff4d6d;
      color: white;
    }
  </style>
</head>

<body>

<button id="shoot">撮影</button>

<a-scene
  mindar-image="imageTargetSrc: chirashi.mind; uiScanning: yes;"
  embedded
  color-space="sRGB"
  renderer="colorManagement: true; physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity mindar-image-target="targetIndex: 0">
    <a-entity id="heart-container"></a-entity>
  </a-entity>

</a-scene>

<script>
  const container = document.querySelector('#heart-container');

  function spawnHeart() {
    const heart = document.createElement('a-entity');

    const x0 = (Math.random() - 0.5) * 0.6;
    const y0 = 0;
    const z0 = (Math.random() - 0.5) * 0.6;
    const scaleVal = 0.25;

    heart.setAttribute('gltf-model', 'url(heart2.glb)');
    heart.setAttribute('position', `${x0} ${y0} ${z0}`);
    heart.setAttribute('scale', `${scaleVal} ${scaleVal} ${scaleVal}`);

    heart.setAttribute('animation__move', {
      property: 'position',
      to: `${x0} ${y0 + 0.8} ${z0}`,
      dur: 1400,
      easing: 'easeOutQuad'
    });

    heart.addEventListener('animationcomplete__move', () => {
      heart.remove();
    });

    container.appendChild(heart);
  }

  setInterval(spawnHeart, 350);

  // ===== 撮影処理（重要） =====
  document.getElementById('shoot').onclick = () => {
    const video = document.querySelector('video');
    const glCanvas = document.querySelector('canvas');
    const w = video.videoWidth;
    const h = video.videoHeight;

    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');

    ctx.drawImage(video, 0, 0, w, h);
    ctx.drawImage(glCanvas, 0, 0, w, h);

    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = 'chirashi_ar.png';
    a.click();
  };
</script>

</body>
</html>
