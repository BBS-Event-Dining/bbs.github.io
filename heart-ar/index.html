<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>Heart AR Sample</title>
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
    <!-- AR.js -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <!-- ARシーン -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: true">

      <!-- Hiroマーカー -->
      <a-marker preset="hiro">
        <!-- heart.glbを表示 -->
        <a-entity
          gltf-model="url(heart2.glb)"
          scale="0.2 0.2 0.2"
          position="0 0 0"
          rotation="0 0 0"
          animation__scale="property: scale; to: 0.4 0.4 0.4; dur: 600; easing: easeOutBack"
          animation__move="property: position; to: 0 0.3 0.2; dur: 1200; easing: easeOutQuad">
        </a-entity>
      </a-marker>

      <!-- カメラ -->
      <a-entity camera></a-entity>

    </a-scene>
  </body>
</html>
